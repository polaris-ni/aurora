# ============================================================================
# Aurora Debug API single source of truth (SSOT)
# ----------------------------------------------------------------------------
# Declares all public free functions under the `aurora::debug` namespace
# (excluding internal `detail::` symbols).
#
# Consumed by tools/gen/gen_debug_api.cpp to generate the "debug" section of
# aurora_api.json (merge-only). Edit here -> rerun
# `cmake --build build --target gen_debug_api_json` -> JSON stays in sync,
# no manual edits to GUIDELINE.md required (eliminates doc drift).
#
# Fields:
# - name       : C++ function name
# - since      : version introduced
# - gated      : compile switch name, or "none" when the API is always
#                available regardless of build flags (e.g. the output-dir
#                helpers). NOTE: omitting the key makes gen_debug_api.cpp
#                default it to AURORA_ENABLE_DEBUG, so "none" must be
#                written explicitly.
# - signature  : full signature (incl. default args), for toolchain / LSP / docs
# - summary    : human-readable description
# - header     : declaring header (traceable, optional)
#
# Parse convention (see gen_debug_api.cpp): a `[[function]]` starts a block;
# `#` starts a comment; `key = "value"`.
# ============================================================================

