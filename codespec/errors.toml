# ============================================================================
# Aurora Error Codes - Single Source of Truth
# ----------------------------------------------------------------------------
# Each error is declared once: enum / slug / category / severity / auto_fixable /
# fix_category / retryable / message / hint.
#
# - enum         : C++ identifier (in-process type-safe key, freely renameable)
# - slug         : frozen outward contract (e.g. "nav-depth-exceeded"); renaming
#                  the enum does not affect it; out-of-process (JSON/log/IDE
#                  tools) only recognize the slug, append-only
# - category     : general|layout|widget|render|io|validation|navigation|
#                  platform|runtime|generation|diagnostic
# - severity     : info|warning|error|fatal
# - auto_fixable : whether it can be auto-fixed by an AI / tool
# - fix_category : fix strategy classification (type_error|missing_prop|
#                  invalid_value|missing_child|unknown_widget|resource_error|
#                  exception|timeout|empty|layout_conflict|unknown)
# - retryable    : whether it can be retried
# - message      : default message template, {placeholder} rendered by ErrorParams
# - hint         : human-readable fix hint (also drives Diagnostic explanation)
#
# Generated by tools/gen_error_codes.cpp:
#   include/aurora/core/error_codes.gen.h
#   codespec/ERROR_CATALOG.md
#   the "error_codes" section of aurora_api.json
# ============================================================================

