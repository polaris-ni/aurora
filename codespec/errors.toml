message = "TLS certificate rejected: '{detail}'"
hint = "Chain verification failed (unknown issuer, expired or not-yet-valid leaf, hostname mismatch, or a policy constraint). Install the issuing CA into the trust root used by this TlsContext, or point TlsContext::add_trusted_certificate at the right PEM; do not reach for allow_insecure_certificate, which turns a real man-in-the-middle signal off for the whole transport"

[[error]]
enum = "NetTlsVersionMismatch"
slug = "net-tls-version-mismatch"
category = "io"
severity = "error"
retryable = false
message = "TLS protocol version mismatch: '{detail}'"
hint = "TlsContext::min_version rules out every version the peer is willing to speak (commonly a TLS 1.3-only floor against a 1.2 endpoint). Lower the floor deliberately and record why, rather than mirroring the peer automatically: the floor is the negotiated security baseline"

[[error]]
enum = "NetTlsEngineUnavailable"
slug = "net-tls-engine-unavailable"
category = "io"
severity = "error"
retryable = false
message = "No TLS backend available: '{detail}'"
hint = "Call aurora::net::available_tls_backends(): an empty list means this build compiled no TLS engine, so supply a provider through AURORA_NET_TLS_PROVIDERS=<static|shared>:<install root> or register a backend with aurora::net::register_tls_backend(). A non-empty list means the candidate chain matched nothing instead: check set_default_tls_backends() and TlsContext::backend, whose id must be one of the listed backends. Aurora never downgrades a TLS request to plaintext"

[[error]]
enum = "NetTlsPinMismatch"
slug = "net-tls-pin-mismatch"
