hint = "The peer's certificate does not carry any pinned public key, so the pinned identity changed (key rotation, reissued certificate, or an interception proxy). Update the pinned SPKI digests from an out-of-band source you trust and rotate them in lockstep with the service; never fall back to allow_insecure_certificate, which defeats the pin entirely"
[[error]]
enum = "HttpRequestInvalid"
slug = "http-request-invalid"
category = "io"
severity = "error"
retryable = false
message = "HTTP request cannot be sent as written: '{detail}'"
hint = "The request violates the message grammar before any byte is written (unknown method text, a header name outside the token charset, a header value containing CR or LF, or a target URL without a host). Fix the request at the call site; the peer never sees it, so retrying with the same fields reproduces the same rejection"

[[error]]
enum = "HttpTimeout"
slug = "http-timeout"
category = "io"
severity = "error"
retryable = true
message = "HTTP request timed out: '{detail}'"
hint = "The detail names which of the three stages expired (connect, read_idle or total), and they mean different things: connect says nothing answered, read_idle says the body stalled mid-flight, total says the whole exchange overran. Raise only the stage that fired - a blanket total budget turns slow-but-healthy transfers into failures"

[[error]]
enum = "HttpRedirectLimit"
slug = "http-redirect-limit"
category = "io"
severity = "error"
retryable = false
message = "HTTP redirect chain exceeded the configured limit: '{detail}'"
hint = "Either the peer is bouncing between targets or the limit is genuinely too small for this endpoint's chain. Inspect the Location sequence in the diagnostics before raising the limit, because following a cycle also leaks credentials to each hop it revisits"

[[error]]
enum = "HttpBodyTooLarge"
slug = "http-body-too-large"
category = "io"
severity = "error"
retryable = false
message = "HTTP response body exceeds the configured limit: '{detail}'"
hint = "The guard is what keeps a wrong URL (a video behind a shortened link) from exhausting memory. The detail says which ceiling was crossed: max_body_bytes bounds the bytes that arrived on the wire, max_decompressed_bytes bounds the transparently decompressed payload (the decompression-bomb guard). Raise the one that fired if the payload is legitimately large, or switch to open_stream so the body is delivered in bounded chunks instead of materialized"

[[error]]
enum = "HttpCharsetUnsupported"
slug = "http-charset-unsupported"
category = "io"
severity = "error"
retryable = false
message = "HTTP response charset is not supported: '{detail}'"
hint = "Response::text() decodes only UTF-8 and Latin-1 in this batch, so a body labelled with any other charset cannot be turned into text here. The undecoded bytes are always reachable through body(), so transcoding is the caller's to do; do not silently substitute U+FFFD or reinterpret the bytes as UTF-8, which would corrupt the payload"

[[error]]
enum = "HttpProtocolError"
slug = "http-protocol-error"
category = "io"
severity = "error"
retryable = false
message = "HTTP peer violated the message grammar: '{detail}'"
hint = "The response is not parseable as HTTP/1.1 (bad status line, a chunk size that is not hexadecimal, framing that declares both Content-Length and an unknown Transfer-Encoding, or a body longer than its declared length). Close the connection and re-issue on a fresh one, because the byte stream is now misaligned and no later response on it can be trusted"

[[error]]
enum = "HttpContentEncodingUnsupported"
slug = "http-content-encoding-unsupported"
category = "io"
severity = "error"
retryable = false
message = "HTTP response content encoding is not supported: '{detail}'"
hint = "The peer applied a content coding this client cannot undo - either the coding name is outside the advertised set (brotli and zstd are not built here) or the build was configured with AURORA_ENABLE_COMPRESSION=OFF, in which case no decoder exists and the request deliberately never advertised Accept-Encoding. Re-request with an encoding you can decode (Request::header sets Accept-Encoding; an identity body always arrives undecoded); never reinterpret the compressed bytes as text, which would hand the caller garbage"

[[error]]
enum = "HttpBodyCorrupt"
slug = "http-body-corrupt"
category = "io"
severity = "error"
retryable = false
message = "HTTP response body cannot be decoded: '{detail}'"
hint = "The message framed cleanly but its payload did not survive the declared content coding: the gzip/zlib/deflate stream is corrupt, truncated mid-symbol, or fails its trailing checksum. This is a data defect (at the peer, or in the encoding chain it declared), not a transport fault - the bytes arrived whole, so retrying the same target only re-fetches the same broken payload; check the declared Content-Encoding chain before suspecting the link"
