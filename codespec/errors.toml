hint = "The stream is valid but its decompressed size crossed DecompressOptions::max_output_bytes, the decompression-bomb guard. Raise the limit if the payload is legitimately large, or stream it with Decompressor and process chunks as they arrive instead of materializing everything"

[[error]]
enum = "CompressionUnavailable"
slug = "compression-unavailable"
category = "io"
severity = "error"
retryable = false
message = "Compression operation unavailable: '{detail}'"
hint = "No codec is registered for this format ID (the detail names it; check for typos against the predefined AURORA_COMPRESS_FORMAT_* constants), or the registered codec does not support this direction (a decompression-only codec refuses compress), or the build was configured with AURORA_ENABLE_COMPRESSION=OFF so the builtin decoders are absent. Register an implementation with aurora::register_codec (it can also replace builtin slots), or rebuild with AURORA_ENABLE_COMPRESSION=ON"

