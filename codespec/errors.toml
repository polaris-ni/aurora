message = "WebSocket send queue is full: '{detail}'"
hint = "The producer outran the wire: pending outgoing payload reached its byte cap or the queue its entry cap. This refuses only the message that hit the limit and leaves the connection open, on purpose - whether to keep buffering, drop, or close is the caller's decision. Slow the producer down or raise the matching WebSocketOptions field"

