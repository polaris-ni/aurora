<!doctype html>
<!--
  wasm_raf_shell.html — rAF 探针的 Emscripten 页面壳（--shell-file 注入）。

  唯一契约：提供 `<canvas id="aurora-canvas">`——`WasmOptions::canvas_id` 默认值，
  `WasmSurface::present()` 经 getElementById 定位上屏目标并按帧缓冲自动调整画布尺寸。
  页面其余部分刻意留白：验收断言（帧数标题/点击计数/异步续体）全部由探针 C++ 侧驱动。
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>aurora-wasm-raf</title>
    <style>
        body { margin: 0; background: #202024; display: flex; justify-content: center; }
        canvas#aurora-canvas { margin-top: 24px; outline: 1px solid #444; }
    </style>
</head>
<body>
<canvas id="aurora-canvas" width="640" height="480" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<!-- {{{ SCRIPT }}} 由 Emscripten 展开为引入生成 JS 的 <script> 标签，勿再包一层 <script>。 -->
{{{ SCRIPT }}}
</body>
</html>
