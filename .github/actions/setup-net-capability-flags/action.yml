name: Setup network capability flags
description: >-
  为调用作业装配「网络能力开关串」：
  ① Inspector HTTP 服务器（`AURORA_BUILD_INSPECTOR_SERVER`，默认 OFF 的交付物开关，
     `src/aurora/inspector/inspector_server.cpp` 编为独立静态库）；
  ② TLS 后端。Windows / macOS 有系统栈缺省装配（Schannel / SecureTransport），串里不带 provider 即已
     「有 TLS」。Linux / 其它 POSIX 侧没有缺省系统栈，本串用内置源码 mbedTLS
     （`AURORA_ENABLE_NET_TLS_MBEDTLS=ON`）给出一条腿——源码在 `third_party/mbedtls`、随 checkout 就位、
     断网可构建，本动作**不再安装任何依赖**。需要OpenSSL 的作业自行在矩阵里追加 `AURORA_NET_TLS_PROVIDERS=shared:/usr` 并装 `libssl-dev`。
  为什么要集中在这里：`utest_inspector_server` 与 `utest_net_tls` 在宏/后端缺席时整文件降级 SKIP
  （前者按 `AURORA_BUILD_INSPECTOR_SERVER`，后者按 `Engine::capabilities().tls`），开关不开等于
  这两个套件在 CI 里从未真正执行过。口径见 `codespec/BUILD_OPTIONS.md` §1.2 / §2.3。
inputs:
  flavor:
    description: >-
      `native`（默认）：按 runner OS 取串。`wasm`：Emscripten 口径只取 Inspector —— 浏览器侧 TLS 走
      fetch、不编 mbedTLS / OpenSSL，硬给 TLS 开关必然 configure 期 FATAL。
    required: false
    default: native
outputs:
  flags:
    description: 追加到 cmake 命令行末尾的一串 -D 开关
    value: ${{ steps.resolve.outputs.flags }}
runs:
  using: composite
  steps:
    - name: Resolve flags
      id: resolve
      shell: bash
      run: |
        if [ "${{ inputs.flavor }}" = "wasm" ]; then
          flags="${NET_CAPABILITY_FLAGS_WASM}"
        else
          case "$RUNNER_OS" in
            Linux)   flags="${NET_CAPABILITY_FLAGS_LINUX}" ;;
            Windows) flags="${NET_CAPABILITY_FLAGS_WINDOWS}" ;;
            macOS)   flags="${NET_CAPABILITY_FLAGS_MACOS}" ;;
            *)       flags="" ;;
          esac
        fi
        echo "::notice::network capability flags (${{ inputs.flavor }}): $flags"
        echo "flags=$flags" >> "$GITHUB_OUTPUT"
