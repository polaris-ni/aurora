# ---------------------------------------------------------------------------
# Aurora CodeQL (advanced setup)
#
# Deliberately separate from ci.yml. ci.yml owns the 11-job lint gate matrix and
# its fixed exits; adding a job there would change that matrix and need a
# change proposal. Advanced setup is required because default setup cannot
# exclude paths: every open alert in this repository comes from vendored
# third_party/ sources, which are tracked and fixed upstream, not here.
#
# Both languages use build-mode: none. C/C++ supports database creation
# without a build, so the Aurora multi-backend CMake configure is not needed;
# this matches the coverage default setup already used. With build-mode: none
# the paths-ignore filter in the config file applies to the extracted sources.
# ---------------------------------------------------------------------------
name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: c-cpp
            build-mode: none
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
