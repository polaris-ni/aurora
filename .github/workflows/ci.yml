# ---------------------------------------------------------------------------
# Aurora CI
#
# 覆盖策略（宏 = 编译结果，矩阵按「每个 feature 分支至少被一个 job 编译一次」设计）：
#   1. core        — 各 OS × 编译器默认配置矩阵（linux/gcc、linux/clang、windows/msvc、
#                    windows/mingw、windows/clang-cl、macos/clang），覆盖 clang 在 MSVC 运行时
#                    模式（clang-cl）下的可编译性；Release（AUTO=OFF）+ Debug（AUTO=ON 分支，
#                    linux/gcc、windows/msvc、windows/clang-cl 各一份）；linux 与 windows/clang-cl
#                    额外构建 demos 聚合目标（EXCLUDE_FROM_ALL，默认构建不含）。
#   2. backends    — 非 HEADLESS 后端各自至少编译一次：X11/Wayland/GLFW（linux）、
#                    D3D11/GLFW（win32）、macOS/GLFW（darwin）；ctest 下无显示环境，
#                    create_native_window 回退 HeadlessSurface，编译与注册逻辑仍被覆盖。
#                    Linux 腿额外打开 GLFW GL 3.3 栅格（AURORA_ENABLE_GLFW_GPU_GL）与
#                    内置音频（ALSA）；三腿均打开 AURORA_BUILD_VERIFY_TOOLS 并把本平台
#                    全部真机验收探针显式编出（此前仅 lint 静态分析），覆盖探针编译面。
#                    三腿均打开 AURORA_BACKEND_GPU_WGPU：wgpu-native 经 cargo 源码构建（需
#                    Rust 工具链 + libclang，见各腿 Setup 步骤），wgpu_native 静态库与 WgpuRhi
#                    C++ 后端在 linux/win32/macOS 各编一次。测试侧按运行期 adapter 分化：win32
#                    腿（D3D12）与 macOS 腿（Metal）runner 有 adapter，utest_wgpu_rhi 整套真跑
#                    像素断言；Linux 腿无 GPU adapter 整套 SKIP（该腿只验编译与注册逻辑）。
#   3. toggles     — feature 宏极性收口（ubuntu/gcc）：优化三开关全关（退化路径）、
#                    SIMD 关（标量黄金路径）、图像编解码 + Inspector Server + WebView 控件
#                    （WEBKITGTK 引擎关，见 env 注释）+ 内置音频 + SQLite 存储后端开
#                    （真编译+跑单测）、COMPRESSION 关（解压不可用降级路径）、
#                    DEBUG+TEST_HOOKS 双关（Release 发布态 PUBLIC 宏组合）、
#                    PROFILING/TRACING/DEBUG 强制开（Release 下 FORCE=ON 分支）。
#  3b. tls-providers — TLS 后端装配腿（Linux 双引擎：内置源码 mbedTLS + 动态 OpenSSL(/usr) provider、
#                    Windows 动态 OpenSSL(vcpkg) 与系统栈 Schannel 并存、
#                    macOS 系统栈 SecureTransport 单腿、macOS 动态 OpenSSL(homebrew) 与系统栈并存）：
#                    验证 `AURORA_ENABLE_NET_TLS_MBEDTLS` 内置源码构建、`AURORA_NET_TLS_PROVIDERS` 的
#                    逐项探测→引擎宏推导→导入目标链接（现为 OpenSSL 唯一 provider），以及「系统栈 /
#                    内置 mbedTLS / OpenSSL provider 同时在案」这条共存关系。provider 的两种 **形态**
#                    （静态 / 动态）与两种 **平台**（Windows / darwin）都被推一遍。
#  3c. 网络能力面（Inspector HTTP 服务器 + TLS provider）不是某一个作业的职责，而是**流水线的
#                    公共前缀**：`setup-net-capability-flags` 复合动作按 runner OS 装配开关串并在
#                    Linux 侧装 provider 依赖，core / backends / toggles / tls-providers / asan /
#                    coverage / install-consumer 全部引用同一份；wasm 用 `wasm` flavor 只取
#                    Inspector（Emscripten 侧没有 provider 安装根）。为什么不能有作业偷偷不开：
#                    `utest_inspector_server` 按 `AURORA_BUILD_INSPECTOR_SERVER` 整文件降级 SKIP、
#                    `utest_net_tls` 按 `Engine::capabilities().tls` 大半 SKIP——关一场就少一场覆盖，
#                    而这场覆盖没有别的作业补得上。开关串集中在该动作的注释里，改一处即全流水线同步。
#   4. asan        — AURORA_ENABLE_ASAN=ON（AddressSanitizer + UBSan）跑全量 ctest。
#   5. coverage    — AURORA_ENABLE_COVERAGE=ON 的 `coverage` 聚合目标（内含 ctest + gcov 摘要）。
#   6. wasm        — emcmake + AURORA_BACKEND_WASM=ON，构建库与测试 runner 并跑 ctest
#                    （Emscripten 无线程/子进程的能力用例以 SKIP 计入，见 tests/framework/assertions.h）。
#                    两腿：默认单线程 与 -pthread 真并行（AURORA_ENABLE_WASM_PTHREADS=ON），
#                    覆盖该宏的 `-pthread` 链接标志与 ThreadPool 行为分支。
#  7. install     — cmake --install + 工作流内联最小消费端端到端验证
#                    （find_package(Aurora) + 静态链接 + feature 宏导出一致性）。
#  8. lint        — clang-tidy 门禁，矩阵 = pass(DEBUG OFF / ON + 优化开关全关的反极性遍，三份
#                    编译数据库) × shard(TU 清单分片，现 4 片) 共 12 个作业，去重后 0 finding 才
#                    通过。纯静态分析，主 Linux 遍在 ubuntu-26.04 单跑，且 configure 打开**除
#                    Windows/macOS 特有宏之外的全部后端与能力开关**（含 WebView 控件；开关串集中
#                    在顶层 env 的 LINT_CAPABILITY_FLAGS*，native 与 wasm 两份口径），使覆盖面
#                    尽可能贴近全仓。
#                    依赖 AuroraLint.cmake 提供的 `lint` 目标与 AURORA_LINT_SHARD 分片开关。
#                    为什么摊成矩阵：runner 只有 4 vCPU，单遍 500+ TU 实测 86 分钟，三遍串跑
#                    4 小时量级、必超时；分片只改排布不减覆盖面，总核时不变而墙钟近线性下降。
#                    ⚠️ 判据是「12 个作业全绿」：任一片红即整门红，缺片等于缺覆盖面。
#                    ⚠️ 本矩阵的口径是 **native**：EMSCRIPTEN 门后的 TU 不在这三份编译库里，
#                    其静态检查由 8w 在同一份 wasm 编译库上跑浏览器口径 lint 补齐；Windows /
#                    macOS 特有宏下的代码各由 8win / 8mac 子作业定向补齐（只扫平台相关 TU）。
#                    全量 / 增量分流（作业 8 / 8w）：全量矩阵只在 PR、master(+main) 推送、
#                    每周定时与手动触发时跑；分支推送由作业 8i「单 job 增量」覆盖——只 lint
#                    「本次改动牵动的 TU」（由 tools/check/select_lint_tus.py 按编译库 include
#                    闭包挑出，详见 BUILD_OPTIONS.md §4.5），把分支 push 的 lint 开销从 12 个
#                    job 压到 1 个。增量省的是 job 数与墙钟：诊断只可能来自 TU 自身与它读到的
#                    头，没被挑中的 TU 本轮不可能产生新告警；全量出口由 PR / master 与每周定时兜底。
#  8w. lint-wasm  — 浏览器口径 clang-tidy（`lint` 目标在 Emscripten 配置下自动加 --emscripten，
#                    见 job 8 与 BUILD_OPTIONS.md §4.5）：4 个分片作业，只 configure 不构建。
#                    这是 EMSCRIPTEN 门后那批 TU 唯一的静态检查面，与 job 8 同为**必过**门禁，
#                    清单仍逐片作 artifact 落盘。
#  8win. lint-windows / lint-macos — 平台专属 lint 子作业：主 Linux 遍开不了 Windows / macOS 特有的
#                    编译选项（那两组宏只在各自平台存在），这两处的 `#ifdef _WIN32` / `__APPLE__`
#                    代码因此不在主遍覆盖面内。子作业用各自的编译库**只扫平台相关 TU**（由
#                    `git grep` 按平台 token 定向选集），不扫全仓，也不做分片；clang-tidy 钉同一
#                    大版本 22（Windows 取官方 LLVM 22 tarball，macOS 取官方 LLVM 22 tarball），
#                    使检查集与主遍可比。Windows 每周定时额外跑一遍**全量**（覆盖「平台 TU 长期
#                    没被 token 选中」的系统性缺口）。
#   9. fmt         — clang-format 排版门禁（`format-check` 聚合目标，任一文件与
#                    `.clang-format` 有差异即红）。版本钉 apt.llvm.org 的 llvm-22 快照：不同
#                    clang 构建的格式化规则会漂移，本机与 CI 必须量同一套。
#
# 格式化器供给（.github/actions/setup-clang-format）：本仓 `.clang-format` 用了枚举形态取值
#   （`BinPackParameters: BinPack`），runner 预装的 clang-format-20/21/22 旧 patch 构建会判
#   `invalid boolean` 而整条命令失败——门槛是「迁移后的较新 patch 构建」，不是主版本号 ≥ 20
#   （口径与逐作业实测证据见 codespec/BUILD_OPTIONS.md §4.7）。configure 期的
#   `aurora_find_clang_format` 因此可能一个候选都挑不中，`format` / `format-check` 目标不生成、
#   `generate_error_codes` 换不到可用格式化器，只留一行 warning 静默降级。处置：凡跑 configure 的 Linux 作业
#   都引用该复合动作（core / backends 的 Linux 矩阵项、toggles、asan、coverage、wasm 及其
#   lint-wasm、install-consumer、fmt），动作里装完立刻用与探针同形态的
#   `--dump-config --style=file:<仓库根绝对路径>` 自证；job 8 / 8w 的 clang-tidy 步骤在同一次 apt 里多带
#   clang-format-22，不重复 `apt-get update`。Windows / macOS 未纳入：无 apt，且这两侧从未因
#   该探测红过。
#
# 编译缓存（ccache-action）：core（Linux/macOS/MinGW/clang-cl）、backends（Linux/macOS）、
#   toggles、asan、coverage、install 各 job 接入，key 按 job/矩阵名分桶；
#   口径（SLOPPINESS / BASEDIR / NOHASHDIR / 压缩）统一由 cmake/AuroraCcache.cmake
#   经编译器启动器注入，与本地构建共享同一缓存语义。windows-msvc 两 job 走默认
#   VS 生成器——CMake 仅在 Makefile/Ninja 生成器实现编译器启动器，VS 生成器下
#   sccache/ccache 均无法挂接，故不接入缓存。
#
# 触发去重（作业 0 gate）：`push: "**"` 与 `pull_request` 对同一分支推送会双跑全家桶。
#   gate 在 push 事件秒级查询「本次 sha 是否已是某个 open PR 的 head」，是则下游重作业全部
#   跳过（该 PR 的 pull_request run 与本次 push 由同一投递创建，覆盖面重合）；没有 open PR
#   的分支推送照旧全量，master/main 与查询失败一律不跳（fail-open）。8i 增量 lint 同吃该
#   输出：有 PR 跑全量矩阵时，增量入口是纯重复。
#
# 编译并行（cmake --build --parallel）：所有库/工具/demos/consumer/format-check 构建行统一
#   带 `--parallel`（Ninja/MSBuild/Make 各自取满 runner 核数，实测核数由 nproc 口径同态）；
#   `lint` 目标内部由 run_clang_tidy.py 按 --jobs 并行（缺省即全核），lint-prereq（生成物先决聚合
#   目标，含 wayland-gen 与各词表生成目标）为秒级 codegen，二者不加 --parallel 亦无串行之虞。
#   ctest 并行口径不变。
#
# 选项语义以 codespec/BUILD_OPTIONS.md 为唯一权威来源。
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  # push 与 pull_request 在同一分支上的双触发由作业 0 `gate` 查重收口：推送的提交若已被
  # open PR 收编（head sha 一致），push 腿的重作业跳过、PR 腿照常全量；没有 PR 的分支推送
  # 不受影响（判据 fail-open，见 gate 作业注释）。
  # 每周一次全量 + 手动触发：增量门禁的覆盖面是「本次改动牵动的 TU」，而「某个 TU 长期
  # 没被任何 PR 选中」这类系统性缺口不会自愈。全量门槛因此保留两处固定出口：master 推送
  # 与每周一凌晨的定时遍；workflow_dispatch 供人工补跑。
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # lint 家族共用的「全能力开关集」，两份口径各自一串（折叠标量 >- 按空格并成单行 shell 参数）：
  #   LINT_CAPABILITY_FLAGS       — job 8（native 双 pass）与 8i 的 build-lint-off / build-lint-on；
  #   LINT_CAPABILITY_FLAGS_WASM  — job 8w 与 8i 的 build-wasm-lint（浏览器口径，无 PROFILING/VERIFY）。
  # 集中一处维护，改这里即全部 lint 腿同步，消除四处粘贴漂移。
  # WEBVIEW 宏是 PRIVATE：开启即让 webview 收口代码进入分析面；Linux 上显式关掉 WEBKITGTK
  # （其引擎编译需 GTK3/WebKitGTK dev 头，lint 静态面不付这份依赖）。
  # ⚠️ 折叠标量 >- 内部禁写 `#` 注释行：块标量里 `#` 是**字面内容**而非 YAML 注释，会随
  # ${{ env.* }} 展开进 shell，把该行剩余部分连同行尾续行 `\` 一起注释掉——轻则丢失参数，
  # 重则把下一行变成独立命令（`-D...: command not found`，exit 127）。注释一律写在键外。
  # TLS 覆盖面说明：mbedTLS 由仓库内置源码构建（`AURORA_ENABLE_NET_TLS_MBEDTLS=ON`，源码随 checkout
  # 就位，无需 /opt provider 根）；optimizations-off pass 追加一条 OpenSSL provider（`shared:/usr`），
  # 两枚引擎 TU 各拿到一次 lint 分析面。
  LINT_CAPABILITY_FLAGS: >-
    -DAURORA_BACKEND_X11=ON -DAURORA_BACKEND_WAYLAND=ON -DAURORA_BACKEND_GLFW=ON
    -DAURORA_ENABLE_GLFW_GPU_GL=ON -DAURORA_BACKEND_GPU_WGPU=ON
    -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_STORAGE_SQLITE=ON
    -DAURORA_ENABLE_IMAGE_JPEG=ON -DAURORA_ENABLE_IMAGE_WEBP=ON -DAURORA_ENABLE_IMAGE_PNG=ON
    -DAURORA_ENABLE_WEBVIEW=ON -DAURORA_ENABLE_WEBVIEW_WEBKITGTK=OFF
    -DAURORA_ENABLE_PROFILING=ON -DAURORA_ENABLE_TRACING=ON
    -DAURORA_BUILD_INSPECTOR_SERVER=ON -DAURORA_BUILD_VERIFY_TOOLS=ON
    -DAURORA_ENABLE_NET_TLS_MBEDTLS=ON
  LINT_CAPABILITY_FLAGS_WASM: >-
    -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_STORAGE_SQLITE=ON
    -DAURORA_ENABLE_IMAGE_JPEG=ON -DAURORA_ENABLE_IMAGE_WEBP=ON -DAURORA_ENABLE_IMAGE_PNG=ON
    -DAURORA_ENABLE_WEBVIEW=ON
    -DAURORA_BUILD_INSPECTOR_SERVER=ON
  # 网络能力开关串（由 .github/actions/setup-net-capability-flags 消费，避免逐作业粘贴漂移）：
  #   Inspector HTTP 服务器 + TLS 后端。前者是默认 OFF 的交付物开关，关闭时 `utest_inspector_server`
  #   整文件降级 SKIP；后者在 Linux / 其它 POSIX 侧**没有缺省系统栈**，不开一条 TLS 腿就没有任何引擎在案
  #   （`utest_net_tls` 大半 SKIP、`capabilities().tls` 为假）。
  #   Linux 串开内置 mbedTLS（`AURORA_ENABLE_NET_TLS_MBEDTLS=ON`）：源码在 `third_party/mbedtls`、随
  #   checkout 就位、断网可构建，不再需要外部安装根或 `/opt` 引导（旧 `static:/opt/aurora-tls-mbedtls`
  #   provider 路径已废弃）。需要 OpenSSL 的一侧直接在 `AURORA_NET_TLS_PROVIDERS` 里追加一条 `shared:/usr`
  #   ——那里 openssl 头齐备（作业 3b 的双引擎腿、作业 8 的 optimizations-off 遍、toggles 反极性腿如此）。
  #   Windows / macOS 靠系统栈缺省装配（Schannel / SecureTransport），两串因此只带 Inspector——provider
  #   形态的同平台覆盖面由作业 3b 的对应腿平行补上。
  #   wasm 串同样只取 Inspector：Emscripten 侧不编 mbedTLS/OpenSSL，TLS 走浏览器 fetch。
  NET_CAPABILITY_FLAGS_LINUX: >-
    -DAURORA_BUILD_INSPECTOR_SERVER=ON -DAURORA_ENABLE_NET_TLS_MBEDTLS=ON
  NET_CAPABILITY_FLAGS_WINDOWS: >-
    -DAURORA_BUILD_INSPECTOR_SERVER=ON
  NET_CAPABILITY_FLAGS_MACOS: >-
    -DAURORA_BUILD_INSPECTOR_SERVER=ON
  NET_CAPABILITY_FLAGS_WASM: >-
    -DAURORA_BUILD_INSPECTOR_SERVER=ON

jobs:

  # ---------------------------------------------------------------------------
  # 0. gate — push / pull_request 查重网关（秒级、零构建）。
  #    `push: "**"` 与 `pull_request` 两个触发器叠在同一分支上时会双跑全家桶：推送的
  #    提交只要已被某个 open PR 收编（head sha 一致），该 PR 的 pull_request run 与本次
  #    push run 由同一次 webhook 投递同时创建，覆盖面完全重合。本作业把这条重合判成
  #    `dup=true`，下游重作业据此跳过；而**没有** PR 的分支推送照旧全量跑——分支 CI
  #    不因挂不挂 PR 而缺席。判据宁松勿紧：查询出错、PR 列表读不到、master/main 推送
  #    一律 dup=false（fail-open，宁可多跑一场也不漏覆盖）。8i 增量 lint 同样吃这个
  #    输出：有 PR 在跑全量矩阵时，增量入口是纯重复。
  # ---------------------------------------------------------------------------
  gate:
    name: gate (push vs pull_request dedup)
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      dup: ${{ steps.dedup.outputs.dup }}
    steps:
      - name: Look for an open PR whose head is exactly this push
        id: dedup
        env:
          GH_TOKEN: ${{ github.token }}
          DUP_EVENT: ${{ github.event_name }}
          DUP_REF: ${{ github.ref }}
          DUP_SHA: ${{ github.sha }}
          DUP_REPO: ${{ github.repository }}
        run: |
          dup=false
          matched=0
          if [ "$DUP_EVENT" = "push" ] && [ "$DUP_REF" != "refs/heads/master" ] && [ "$DUP_REF" != "refs/heads/main" ]; then
            matched=$(gh api "repos/$DUP_REPO/pulls?state=open&per_page=100" \
              --jq "[.[] | select(.head.sha == \"$DUP_SHA\" and .head.repo.full_name == \"$DUP_REPO\")] | length" 2>/dev/null || echo 0)
            if [ "$matched" -gt 0 ] 2>/dev/null; then dup=true; fi
          fi
          echo "dup=$dup" >> "$GITHUB_OUTPUT"
          echo "push/PR dedup: dup=$dup (open PRs with head=$DUP_SHA: $matched)"

  # ---------------------------------------------------------------------------
  # 1. 核心矩阵：默认配置 + 构建类型极性（AUTO 三态的两个分支）
  # ---------------------------------------------------------------------------
  core:
    name: core (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-release
            os: ubuntu-26.04
            build-type: Release
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            build-demos: true
            # E2E 期望集 = 作业实际编译的真实后端（见 08-tooling §8.2「CI 作业口径」）。
            # core 的 linux 默认后端面是纯 Headless（X11/GLFW 默认 OFF），无真实后端可期望。
            e2e-expect: ""
          - name: linux-gcc-debug
            os: ubuntu-26.04
            build-type: Debug
            # 构建提速：unity 批处理（gcc/PCH 关，本地已 440 例 ctest 验证；DEBUG 下测试 -O 档
            # auto 不注入，保持可调试）。见 codespec/BUILD_OPTIONS.md §4.8 / CHANGELOG。
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DAURORA_UNITY_BUILD=ON
            e2e-expect: ""
          # linux 原生 clang：弥补 gcc 单编译器盲区（模板实例化 / 两阶段名字查找 / ODR 诊断更严格）
          - name: linux-clang-release
            os: ubuntu-26.04
            build-type: Release
            # 构建提速：unity 批处理（clang 侧 PCH 默认 ON，但 unity 与 PCH 正交、不影响优化档；
            # 测试 -O 档 auto 因 PCH 门不注入）。本地 gcc 已全绿，clang 侧作为 CI 拓宽验证。
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DAURORA_UNITY_BUILD=ON
            apt-pkgs: clang
            e2e-expect: ""
          - name: windows-msvc
            os: windows-latest
            build-type: Release
            cmake-flags: "" # 默认 Visual Studio 生成器（多配置）
            # Release 下 AURORA_ENABLE_DEBUG=AUTO→OFF，Win32 读回被门控（期望必误红）；
            # win32 的 E2E 运行覆盖由 Debug 型作业（windows-msvc-debug / windows-llvm）承担
            e2e-expect: ""
          # MSVC 的 AUTO=ON 分支：Debug 下 DEBUG/PROFILING 宏生效，类布局与 Release 不同，
          # 须独立构建并跑全量 ctest（此前 MSVC 仅覆盖 Release）
          - name: windows-msvc-debug
            os: windows-latest
            build-type: Debug
            cmake-flags: "" # 默认 Visual Studio 生成器（多配置）
            # Debug 下 DEBUG 宏生效，Win32 读回可用（Hidden 档真实建窗 + 像素读回）
            e2e-expect: "win32"
          - name: windows-mingw
            os: windows-latest
            build-type: Release
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++
            mingw: true
            e2e-expect: "" # Release 同 windows-msvc；win32 运行覆盖在 Debug 型作业
          # clang-cl（x86_64-pc-windows-msvc，MSVC 运行时 + lld-link）：与 msvc/mingw 并列的
          # Windows 第三编译器；覆盖 SIMD target 属性、__builtin_cpu_supports 回退 __cpuid、
          # 静态链接门禁从「Clang+WIN32」收窄为 MINGW。Debug 下 AUTO 宏生效（类布局与 Release 不同）。
          - name: windows-llvm
            os: windows-latest
            build-type: Debug
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DAURORA_ENABLE_LLD=ON
            build-demos: true
            ccache: true # clang-cl 的 compiler id 为 Clang（非 MSVC），AuroraCcache.cmake 会自动接管启动器
            e2e-expect: "win32"
          - name: macos-clang
            os: macos-latest
            build-type: Release
            cmake-flags: -G Ninja
            # 无人值守会话无窗口系统（探针实测，见 08-tooling §8.2），E2E 全部 skipped by policy
            e2e-expect: ""

    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-clang-format

      # windows-latest 自带 MSYS2 mingw-w64 工具链；choco mingw 路径作后备
      - name: Setup MinGW toolchain
        if: matrix.mingw
        shell: bash
        run: |
          for d in /c/msys64/mingw64/bin "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then echo "$d" >> "$GITHUB_PATH"; break; fi
          done
          gcc --version

      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Install compiler (apt)
        if: matrix.apt-pkgs
        run: sudo apt-get update -y && sudo apt-get install -y ${{ matrix.apt-pkgs }}

      - name: Setup ccache
        if: runner.os == 'Linux' || runner.os == 'macOS' || matrix.mingw || matrix.ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: core-${{ matrix.name }}

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} ${{ matrix.cmake-flags }} ${{ steps.net-flags.outputs.flags }}

      - name: Build (library + tools + tests, timed for link-cost observability)
        if: runner.os != 'Windows'
        shell: bash
        run: time cmake --build build --config ${{ matrix.build-type }} --parallel

      # windows-latest 默认 pwsh，无 bash time；分步保持矩阵统一构建命令
      - name: Build (library + tools + tests)
        if: runner.os == 'Windows'
        run: cmake --build build --config ${{ matrix.build-type }} --parallel

      # 收束期可观测性：ccache 命中率纳入 CI 输出（hendrikmuhs/ccache-action 已注入 PATH）
      - name: ccache stats
        if: runner.os == 'Linux' || runner.os == 'macOS' || matrix.mingw || matrix.ccache
        run: ccache --show-stats --verbose || ccache --show-stats

      # demos 不进默认构建（EXCLUDE_FROM_ALL），单独拉起聚合目标确保持续可编译
      - name: Build demos
        if: matrix.build-demos
        run: cmake --build build --config ${{ matrix.build-type }} --target demos --parallel

      # Linux headless runner 无 X display、无剪贴板工具：装 xvfb + xclip/xsel 并用 xvfb-run
      # 包裹 ctest，让依赖系统剪贴板的用例真正执行而非 SKIP；Windows/macOS 剪贴板原生可用，直跑 ctest。
      - name: Install virtual display + clipboard tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xclip xsel

      - name: Test
        env:
          # Windows (windows-msvc / windows-msvc-debug, default Visual Studio generator) uses a
          # cp1252 console codepage that cannot encode CJK; several tools/check/*.py scripts print
          # Chinese. PEP 540 UTF-8 mode forces UTF-8 stdio so they don't raise UnicodeEncodeError.
          PYTHONUTF8: 1
          # E2E 期望集 = 作业实际编译的真实后端（矩阵字段逐作业声明，见 08-tooling §8.2）
          AURORA_E2E_EXPECT: ${{ matrix.e2e-expect }}
        # bash 显式指定（Windows 默认 pwsh）：统一用 nproc 取核数并行（本地实测 9 倍提速）。
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a ctest --test-dir build --output-on-failure -C ${{ matrix.build-type }} -j "$(nproc)"
          else
            ctest --test-dir build --output-on-failure -C ${{ matrix.build-type }} -j "$(nproc)"
          fi

      # 编译/测试耗时观测（纯观测、恒退出 0、不进门禁；见 ARCHITECTURE.md §14.4）。
      # build_baseline.py 解析 .ninja_log（编译边耗时分布/p95/top-N）与
      # Testing/Temporary/LastTest.log（逐测试串行耗时），落 JSON 供 before/after 对照。
      - name: Build/test timing baseline
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/check/build_baseline.py --build-dir build --json build/build-baseline.json --top 20
          {
            echo "### Build/Test timing baseline (${{ matrix.name }})"
            echo '```json'
            cat build/build-baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-timing-${{ matrix.name }}
          path: |
            build/.ninja_log
            build/Testing/Temporary/LastTest.log
            build/build-baseline.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 2. 后端矩阵：AURORA_BACKEND_* 各非默认后端至少编译一次
  # ---------------------------------------------------------------------------
  backends:
    name: backends (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x11-wayland-glfw
            os: ubuntu-26.04
            apt-deps: libx11-dev libxfixes-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev libclang1-22
            # Release 作业默认 DEBUG=AUTO→OFF，X11 读回被门控——显式 ON 使 etest_x11 真实运行
            # （期望集口径见 08-tooling §8.2「CI 作业口径」；Wayland 无人值守无合成器，不期望）。
            # GLFW 期望 xvfb + mesa(llvmpipe) 提供 GLX 3.3 兼容上下文。
            # 注：本腿不开 AURORA_UNITY_BUILD——后端头（wgpu/GL/X11/GLFW）在 unity 合并 TU
            # 内对 Type/Value/Result/Json 等标识符造成宏泄漏（json.h 解析失败），属本仓后端
            # 头的系统性隐患，需独立头文件宏审计才能安全开启；此处仅保留安全的测试降优档。
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DAURORA_BACKEND_X11=ON -DAURORA_BACKEND_WAYLAND=ON -DAURORA_BACKEND_GLFW=ON -DAURORA_ENABLE_DEBUG=ON -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_GLFW_GPU_GL=ON -DAURORA_BUILD_VERIFY_TOOLS=ON -DAURORA_BACKEND_GPU_WGPU=ON -DAURORA_TEST_OPT_LEVEL=1
            e2e-expect: "x11,glfw"
          - name: windows-d3d11-glfw
            os: windows-latest
            # 同上：DEBUG=ON 使 Win32 读回可用（D3D11 读回无条件可用）；GLFW 在无 GL 环境的
            # runner 上建窗失败（Task 0 实测），不期望。WEBVIEW=ON 自动推导 WEBVIEW2=ON
            # （引擎头 vendor 于 third_party/webview2/，运行期 LoadLibrary、零构建期链接依赖），
            # 覆盖 engine_webview2.cpp 的真编译链接面。
            cmake-flags: -DAURORA_BACKEND_D3D11=ON -DAURORA_BACKEND_GLFW=ON -DAURORA_ENABLE_DEBUG=ON -DAURORA_ENABLE_AUDIO=ON -DAURORA_BUILD_VERIFY_TOOLS=ON -DAURORA_BACKEND_GPU_WGPU=ON -DAURORA_ENABLE_WEBVIEW=ON
            e2e-expect: "win32,d3d11"
          - name: macos-appkit-glfw
            os: macos-latest
            cmake-flags: -G Ninja -DAURORA_BACKEND_MACOS=ON -DAURORA_BACKEND_GLFW=ON -DAURORA_BUILD_VERIFY_TOOLS=ON -DAURORA_BACKEND_GPU_WGPU=ON
            # 无人值守会话无窗口系统（探针实测，见 08-tooling §8.2），E2E 全部 skipped by policy
            e2e-expect: ""

    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        if: runner.os == 'Linux'
        uses: ./.github/actions/setup-clang-format

      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Install desktop backend dev dependencies
        if: matrix.apt-deps
        run: |
          # libclang1-22：wgpu-native 的 build.rs 经 bindgen 从 webgpu.h 生成 FFI 头，构建期硬
          # 依赖 libclang 共享库；apt.llvm.org 的 llvm-22 源提供与 lint 作业同大版本的 libclang。
          sudo wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -y
          sudo apt-get install -y ${{ matrix.apt-deps }}

      - name: Setup ccache
        if: runner.os == 'Linux' || runner.os == 'macOS'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: backends-${{ matrix.name }}

      # AURORA_BACKEND_GPU_WGPU=ON 需要 Rust 工具链（cargo/rustc）与 libclang（wgpu-native 的
      # build.rs 经 bindgen 从 webgpu.h 生成 FFI）。三腿都开了 WGPU，configure 期硬探测二者，
      # 缺失即 FATAL，故统一在此准备（必须早于 Configure）。toolchain=stable 在各平台默认解析为
      # 与 C++ 编译器 ABI 一致的目标（linux-gnu / windows-msvc / apple-darwin）。
      - name: Setup Rust toolchain (wgpu backend)
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # stable 通道会随发布滚动；把解析后的版本号暴露给 cargo 缓存键，避免跨版本复用不兼容的
      # target 产物导致误链接。三平台统一用 bash 取 rustc 版本号（dtolnay 已把 cargo/rustc 入 PATH）。
      - name: Export resolved Rust version
        shell: bash
        run: echo "RUST_VER=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"

      # cargo 缓存（wgpu-native 经 cargo 源码构建，首次拉 crates.io + 全量编译耗 5–15min/次）：
      # ① registry/git 索引与下载缓存——按 Cargo.lock 哈希命中，跨 Rust 小版本稳定；
      # ② wgpu-native 的 target/ 构建产物——按 平台 + Rust 版本 + lock 哈希 命中。两段均命中后，
      # 因 .rs 与 Cargo.lock 冻结，cargo build 仅复用、不重编，backends 三腿墙钟显著下降。
      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('third_party/wgpu-native/Cargo.lock') }}
          restore-keys: |
            cargo-registry-

      - name: Cache wgpu-native build
        uses: actions/cache@v6
        with:
          path: third_party/wgpu-native/target
          key: cargo-wgpu-${{ runner.os }}-${{ env.RUST_VER }}-${{ hashFiles('third_party/wgpu-native/Cargo.lock') }}
          restore-keys: |
            cargo-wgpu-${{ runner.os }}-${{ env.RUST_VER }}-

      # Windows / macOS 运行器无 libclang（bindgen 构建期硬依赖）；Linux 经上方 apt.llvm.org 的
      # libclang1-22 满足。此处下载 LLVM 官方 tarball 取 libclang，并把其 bin 入 PATH——cmake
      # 探测到 clang 在 PATH 即定位同目录 libclang（见 AuroraBackends.cmake）。与 lint 作业 8w/8mac
      # 同口径，仅此处用于构建而非 clang-tidy。
      - name: Install LLVM 22 (libclang for wgpu bindgen)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          $out = Join-Path $env:RUNNER_TEMP "llvm.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $out
          $dest = Join-Path $env:RUNNER_TEMP "llvm"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          & $sevenZip x $out "-o$dest" -y | Out-Null
          & $sevenZip x (Join-Path $dest "llvm.tar") "-o$dest" -y | Out-Null
          $bin = (Get-ChildItem -Path $dest -Recurse -Filter "clang.exe" | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "clang.exe not found after extracting $url" }
          # libclang 共享库位置随平台而异（Windows 在 bin/）；bindgen 经 LIBCLANG_PATH 定位，
          # 直接指到 libclang 实际所在目录，避免 clang 在 PATH 误导探针指向无 libclang 的目录。
          $libpath = (Get-ChildItem -Path $dest -Recurse -Filter "libclang.dll" | Select-Object -First 1).DirectoryName
          if (-not $libpath) { throw "libclang.dll not found after extracting $url" }
          Add-Content -Path $env:GITHUB_ENV -Value "LIBCLANG_PATH=$libpath"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "clang.exe") --version

      - name: Install LLVM 22 (libclang for wgpu bindgen)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/llvm.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP"
          # LLVM 官方包装的 bin/clang 是指向 clang-22 的符号链接（真实二进制带版本后缀），
          # 故 find 不得加 -type f；落到 -x 复核可执行性（跟随符号链接判定）。
          bindir="$(dirname "$(find "$RUNNER_TEMP" \( -type f -o -type l \) -name clang -path '*/bin/*' | head -1)")"
          if [ -z "$bindir" ] || [ "$bindir" = "." ] || [ ! -x "$bindir/clang" ]; then
            echo "::error::clang not found after extracting $url"
            exit 1
          fi
          # macOS 上 libclang.dylib 在 <extract>/lib（不在 bin），bindgen 经 LIBCLANG_PATH 定位，
          # 故直接指到 libclang 实际所在目录；否则 clang 在 PATH 会把探针带向无 libclang 的目录。
          # 文件名必须精确匹配 `libclang.dylib`：`libclang*.dylib` 会先命中
          # lib/clang/*/lib/darwin/ 下的编译器运行时（libclang_rt.asan_osx_dynamic.dylib 等），
          # 那目录里没有 bindgen 要的共享库（实测：LIBCLANG_PATH 被指成 darwin 子目录即
          # "Unable to find libclang"）。
          libdir="$(dirname "$(find "$RUNNER_TEMP" \( -type f -o -type l \) \( -name 'libclang.dylib' -o -name 'libclang.so*' -o -name 'libclang.dll' \) | head -1)")"
          if [ -z "$libdir" ] || [ ! -e "$libdir/libclang.dylib" ]; then
            echo "::error::libclang.dylib not found after extracting $url"
            exit 1
          fi
          echo "LIBCLANG_PATH=$libdir" >> "$GITHUB_ENV"
          echo "$bindir" >> "$GITHUB_PATH"
          "$bindir/clang" --version

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake-flags }} ${{ steps.net-flags.outputs.flags }}

      - name: Build (library + tools + tests)
        shell: bash
        run: cmake --build build --config Release --parallel

      # 真机验收探针（EXCLUDE_FROM_ALL，默认构建不含）：VERIFY_TOOLS 打开后本平台所有可用探针
      # 在此显式编出，证明它们对当前 API/平台的编译面——此前仅 lint 静态分析、从不编二进制。
      # 探针不进 ctest、需真实设备/窗口，故只编不跑（运行期判据由人工验收，见 AuroraVerify.cmake）。
      - name: Build verify probes
        if: contains(matrix.cmake-flags, 'AURORA_BUILD_VERIFY_TOOLS')
        run: cmake --build build --config Release --target aurora_verify --parallel

      - name: ccache stats
        if: runner.os == 'Linux' || runner.os == 'macOS'
        run: ccache --show-stats --verbose || ccache --show-stats

      # Linux headless runner 无 X display、无剪贴板工具：装 xvfb + xclip/xsel 并用 xvfb-run
      # 包裹 ctest，让依赖系统剪贴板的用例真正执行而非 SKIP；Windows/macOS 剪贴板原生可用，直跑 ctest。
      - name: Install virtual display + clipboard tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xclip xsel

      - name: Test
        env:
          PYTHONUTF8: 1
          # E2E 期望集 = 作业实际编译的真实后端（矩阵字段逐作业声明，见 08-tooling §8.2）
          AURORA_E2E_EXPECT: ${{ matrix.e2e-expect }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            # 虚拟屏显式 24 位深度：Xvfb 默认是 8 位伪彩，GLX 拿不到 RGBA 视觉，
            # GLFW 腿会在建窗期退化（这也是「GLFW 需要 mesa(llvmpipe) + GLX 3.3」那条前提）。
            #
            # e2e 单独一趟且**串行**（其余测试仍满核并行）：e2e 用例建的是真实窗口与真实
            # GL 上下文，16 路并发挤在同一个 X server 上会互相抢 X / GL 资源，实测表现为
            # x11 与 glfw 两腿**随机**抛 `XOpenDisplay` / `glfwInit` 失败（同一进程里前一
            # 用例刚过、后一用例就红），属编排层抖动而非代码缺陷。串行不改变任何判据
            # （期望集内不可用仍是红灯），只消除资源争抢；代价是 e2e 段多花十来秒。
            xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure -C Release -LE e2e -j "$(nproc)"
            xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure -C Release -L e2e
          else
            ctest --test-dir build --output-on-failure -C Release -j "$(nproc)"
          fi

      # 编译/测试耗时观测（纯观测、恒退出 0、不进门禁；见 ARCHITECTURE.md §14.4）。
      - name: Build/test timing baseline
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          python3 tools/check/build_baseline.py --build-dir build --json build/build-baseline.json --top 20
          {
            echo "### Build/Test timing baseline (${{ matrix.name }})"
            echo '```json'
            cat build/build-baseline.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload timing artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: build-timing-${{ matrix.name }}
          path: |
            build/.ninja_log
            build/Testing/Temporary/LastTest.log
            build/build-baseline.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 3. feature 宏极性矩阵（ubuntu/gcc，Release）：
  #    Release 下 DEBUG/PROFILING 走 AUTO=OFF，须显式收口两个极端分支
  # ---------------------------------------------------------------------------
  toggles:
    name: toggles (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 架构级优化三开关全关：layout 缓存 / 遮挡剔除 / Display List 退化路径
          - name: optimizations-off
            cmake-flags: -DAURORA_ENABLE_LAYOUT_CACHE=OFF -DAURORA_ENABLE_OCCLUSION_CULLING=OFF -DAURORA_ENABLE_DISPLAY_LIST=OFF
            run-tests: true
          # SIMD 关：仅编译标量黄金路径（utest_simd_parity 比对基准）
          - name: simd-off
            cmake-flags: -DAURORA_ENABLE_SIMD=OFF
            run-tests: true
          # 可选子系统全开：图像编解码（libjpeg-turbo / libwebp / wuffs）+ Inspector HTTP 服务器
          # + 内置音频设备后端 + SQLite 存储后端 + WebView 控件（WEBKITGTK 引擎关——引擎编译需
          # GTK3/WebKitGTK dev 头，见顶层 env 注释；控件与 NativeViewHost 收口照常编译）。
          # AUDIO / STORAGE_SQLITE 此前仅 lint 静态分析（不编二进制、不跑测试），现与编解码一并
          # 真正编译并跑单测（utest_audio / utest_audio_alsa / utest_sqlite_backend），
          # 覆盖链接与运行期守卫分支。
          # Linux 上 AUDIO=ON 自动带 ALSA（运行期 dlopen，无 dev 包依赖）。
          - name: optional-subsystems-on
            cmake-flags: -DAURORA_ENABLE_IMAGE_JPEG=ON -DAURORA_ENABLE_IMAGE_WEBP=ON -DAURORA_ENABLE_IMAGE_PNG=ON -DAURORA_BUILD_INSPECTOR_SERVER=ON -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_STORAGE_SQLITE=ON -DAURORA_ENABLE_WEBVIEW=ON -DAURORA_ENABLE_WEBVIEW_WEBKITGTK=OFF
            run-tests: true
          # 插桩强制开（TRACING 隐含 PROFILING）：AURORA_PROFILE_* 宏活跃分支 + DEBUG=ON
          - name: profiling-tracing-debug-on
            cmake-flags: -DAURORA_ENABLE_PROFILING=ON -DAURORA_ENABLE_TRACING=ON -DAURORA_ENABLE_DEBUG=ON
            run-tests: true
          # DEBUG + TEST_HOOKS 双关：Release 发布态的 PUBLIC 宏组合——调试 API 与测试注入
          # 调用点必须可编译、运行返回 disabled / no-op
          - name: debug-test-hooks-off
            cmake-flags: -DAURORA_ENABLE_DEBUG=OFF -DAURORA_ENABLE_TEST_HOOKS=OFF
            run-tests: true
          # COMPRESSION 关：解压不可用的诚实降级路径（compression-unavailable、
          # HTTP 侧不发 Accept-Encoding / 拒收压缩应答）。utest_core_compression 恒注册、
          # 体内按宏 SKIP，用例面不塌缩。
          - name: compression-off
            cmake-flags: -DAURORA_ENABLE_COMPRESSION=OFF
            run-tests: true
          # TLS 反极性腿：本 job 各腿的公共网络串（NET_CAPABILITY_FLAGS_LINUX）给的是内置 mbedTLS
          # （`AURORA_ENABLE_NET_TLS_MBEDTLS=ON`），本腿追加一条 OpenSSL provider（`shared:/usr` 就是它的
          # 安装根），使 `AURORA_ENABLE_NET_TLS_OPENSSL` 与 `AURORA_ENABLE_NET_TLS_MBEDTLS` 两枚引擎宏
          # 各拿到一次运行期验证（cmake 命令行取同名变量最后一次出现的值，故追加即生效；两枚宏本就并存）。
          - name: tls-openssl-shared
            apt-pkgs: libssl-dev
            cmake-flags: -DAURORA_NET_TLS_PROVIDERS=shared:/usr
            run-tests: true
          # 构建提速旋钮锁点：unity 批处理 + 测试用例 -O1（见 codespec/BUILD_OPTIONS.md §4.8）。
          # 与 core/backends 的 gcc 单配置腿同源，但作为独立选项曲面腿——任一旋钮的 CMake 装配
          # 逻辑回归都会在本腿单独红，不污染主矩阵；同时让 CI 持续验证快构建路径可用。
          - name: fast-build
            cmake-flags: -DAURORA_UNITY_BUILD=ON -DAURORA_TEST_OPT_LEVEL=1
            run-tests: true

    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      # 网络能力串在本 job 是**公共前缀**：全部腿都开 Inspector 与静态 mbedTLS provider——本 job 考察
      # 的是各条极性腿自己的开关，而不是「有没有 TLS」这一层；个别腿再在 matrix.cmake-flags 里追加
      # 同名 provider 值做反极性（cmake 命令行取最后一次出现的 -D）。
      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: toggles-${{ matrix.name }}

      - name: Configure
        # 顺序要紧：同名缓存变量 cmake 取**最后一次**出现的值，故公共网络串在前、matrix.cmake-flags
        # 在后——`tls-openssl-shared` 腿才能用它自己的 provider 覆盖掉公共串的 mbedTLS。
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release ${{ steps.net-flags.outputs.flags }} ${{ matrix.cmake-flags }}

      - name: Build (library + tools + tests)
        run: cmake --build build --config Release --parallel

      - name: ccache stats
        run: ccache --show-stats --verbose || ccache --show-stats

      # headless ubuntu 无 X display、无剪贴板工具：装 xvfb + xclip/xsel 并用 xvfb-run 包裹
      # ctest，让依赖系统剪贴板的用例真正执行而非「剪贴板不可用」永久 SKIP。
      - name: Install virtual display + clipboard tools
        if: matrix.run-tests
        # matrix.apt-pkgs：个别腿需要额外开发包（tls-openssl-shared 腿要 OpenSSL 的头与动态库），
        # 其余腿未定义该字段时展开为空串，安装列表退化为公共部分。
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xclip xsel ${{ matrix.apt-pkgs }}

      - name: Test (under virtual X display)
        if: matrix.run-tests
        env:
          # toggles 只验证 feature 宏极性，编译面是纯 Headless——期望集显式声明为空
          # （「零覆盖」是声明的事实而非疏漏，口径见 08-tooling §8.2「CI 作业口径」）
          AURORA_E2E_EXPECT: ""
        run: xvfb-run -a ctest --test-dir build --output-on-failure -C Release -j "$(nproc)"

  # ---------------------------------------------------------------------------
  # 3b. TLS 后端装配腿：`AURORA_NET_TLS_PROVIDERS` 的逐项探测与链接（后端矩阵）
  #     验收面有两层。构建面：前缀校验 → 头探测推导引擎宏 → 库定位 → 导入目标 → 后端 TU 编译进库。
  #     共存面：系统栈与 provider 在**同一次装配**里同时成立——单腿矩阵证明不了它，而它正是本作业
  #     存在的理由。运行期判据（握手 / 证书 / ALPN / pin 那一组）随 `utest_net_tls` 与
  #     `utest_net_tls_backend` 两套件取，前者在共存装配下逐枚指名后端各完成一次真握手。
  #     Windows 腿带 `AURORA_BUILD_TESTS=OFF`：动态 OpenSSL 的 DLL 不在测试可执行的检索路径上，
  #     运行测试会红成加载失败而不是构建失败——链接面由库与工具目标证明即可。
  #     macOS 两腿的差别是「只有系统栈」与「系统栈 + homebrew provider」：前者验证不给 provider 时
  #     `AURORA_ENABLE_NET_TLS_SECURE_TRANSPORT` + `-framework Security` 能否在真 SDK 上编出来，后者把
  #     `AURORA_ENABLE_NET_TLS_OPENSSL` 这条适配链推到 darwin 上并同时保住系统栈（两枚 provider 宏的
  #     OS 组合至此齐了：mbedTLS-linux、OpenSSL-win32、OpenSSL-darwin）。
  # ---------------------------------------------------------------------------
  tls-providers:
    name: tls provider (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 双引擎同时在案：mbedTLS 走仓库内置源码（`AURORA_ENABLE_NET_TLS_MBEDTLS=ON`，源码随 checkout
          # 就位），动态 OpenSSL 直接指向 `/usr`（Debian multiarch 的库定位顺带被证明）。两条腿一个来自
          # 内置构建、一个来自 provider，kind 不冲突；装配结果里 `mbedtls` 与 `openssl` 都在注册表表面，
          # `utest_net_tls` 因此在这里逐枚各做一次真握手。
          - name: linux-mbedtls-plus-openssl
            os: ubuntu-26.04
            apt-pkgs: libssl-dev
            cmake-flags: -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DAURORA_ENABLE_NET_TLS_MBEDTLS=ON -DAURORA_NET_TLS_PROVIDERS=shared:/usr
          # 动态 OpenSSL + 系统栈 Schannel 并存：`AURORA_ENABLE_NET_TLS_SYSTEM=ON` 本就是该腿缺省，这里显式
          # 写出是为了把「给了 OpenSSL 安装根也照样保住 Schannel」声明成判据而不是巧合。
          # vcpkg classic 模式的三元组根（`include/openssl/ssl.h` + `lib/` + `bin/`）。
          # 装进 `$RUNNER_TEMP/vcpkg` 而不是 `$VCPKG_ROOT`：安装根由本作业自己创建并显式传给
          # provider 变量，不依赖镜像里 vcpkg 的位置与既有已装状态（`AURORA_NET_TLS_PROVIDERS`
          # 只接受安装根，`prefix` 里带盘符冒号正是首冒号切分要保住的那条形态）。
          - name: windows-schannel-plus-openssl
            os: windows-latest
            apt-pkgs: ""
            vcpkg: true
            cmake-flags: -DAURORA_BUILD_TESTS=OFF -DAURORA_ENABLE_NET_TLS_SYSTEM=ON
          # macOS 系统栈腿：不给 provider，证明缺省装配（`AURORA_ENABLE_NET_TLS_SECURE_TRANSPORT` +
          # `-framework Security`）在真 SDK 上编得出来。运行期判据取决于镜像里有无 `openssl`
          # 命令行，缺失时 TLS 套件按 `AURORA_TEST_SKIP` 退避而不是红。
          - name: macos-securetransport-system
            os: macos-latest
            apt-pkgs: ""
            cmake-flags: -G Ninja
          # macOS 并存腿：homebrew 的 OpenSSL 安装根（`$(brew --prefix openssl@3)` = keg-only
          # 的 `/opt/homebrew/opt/openssl@3`，含 `include/openssl/ssl.h` 与 `lib/libssl.dylib`）与系统栈
          # 同时给。装它就对了，而不用 macOS 自带 LibreSSL 那一份：后者既没有 `include/openssl/ssl.h`，
          # `/usr/lib` 下的 `libssl.dylib` 也只是 SDK 占位 shim（链接能过、符号语义不对），provider
          # 校验会直接 FATAL，把安装根指向 /usr 在 darwin 上不可行。本腿是共存形态唯一的运行期实证：
          # `securetransport` 与 `openssl` 各被指名完成一次真握手。
          - name: macos-securetransport-plus-openssl
            os: macos-latest
            apt-pkgs: ""
            homebrew-openssl: true
            cmake-flags: -G Ninja -DAURORA_ENABLE_NET_TLS_SYSTEM=ON
    steps:
      - uses: actions/checkout@v7

      - name: Install apt packages
        if: matrix.apt-pkgs
        run: sudo apt-get update -y && sudo apt-get install -y ${{ matrix.apt-pkgs }}

      # Inspector Server 在四条腿上都打开：本作业验的是「provider 差异」，而 Inspector 是唯一依赖
      # 核心 net 传输面的交付物，它是否还能编得出来，是 provider 换来换去时最容易被打破的那条边。
      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Install OpenSSL into a job-local vcpkg root
        if: matrix.vcpkg
        shell: bash
        run: |
          root="$RUNNER_TEMP/vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg "$root"
          bash "$root/bootstrap-vcpkg.sh" -disableMetrics
          # Git Bash 不做无扩展名补全，Windows 下引导产物是 `vcpkg.exe`，POSIX 下是 `vcpkg`。
          cli="$root/vcpkg"; [ -f "$cli.exe" ] && cli="$cli.exe"
          "$cli" install openssl --triplet x64-windows --x-install-root="$root/installed"

      # provider 只要「安装根」：homebrew 的 keg-only 前缀本身就是合格的安装根，
      # 不做拷贝也不建符号链接，避免「同一环境下有两个位置声称自己是 provider」。
      # 写进 GITHUB_ENV 是因为同一 prefix 稍后还要给 Configure（`-D…=shared:<prefix>`）与
      # Test（`DYLD_LIBRARY_PATH`）用，重复跑 brew 会让两处口径漂移。
      - name: Install OpenSSL via Homebrew (macOS provider root)
        if: matrix.homebrew-openssl
        shell: bash
        run: |
          brew install openssl@3
          prefix="$(brew --prefix openssl@3)"
          test -f "$prefix/include/openssl/ssl.h"
          ls "$prefix/lib"/libssl.*.dylib
          echo "OPENSSL_PREFIX=$prefix" >> "$GITHUB_ENV"

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: tls-${{ matrix.name }}

      - name: Configure
        shell: bash
        run: |
          # 公共串放在最前、矩阵串放在后：CMake 取最后一次 `-D`，而本作业的被测对象恰恰是矩阵里的
          # provider 串——把它排在 `setup-net-capability-flags` 的 Linux 统一串之前，会被那条串悄悄
          # 覆盖回「只装 mbedTLS 一条腿」，矩阵红绿都不再说明装配形态。
          flags="${{ steps.net-flags.outputs.flags }}"
          flags="$flags ${{ matrix.cmake-flags }}"
          # runner 上下文不允许出现在 strategy.matrix，故 vcpkg 共享安装根不在矩阵里写死，
          # 改为运行期用 $RUNNER_TEMP（GitHub 注入的环境变量）拼出并追加——与上方 Install
          # OpenSSL 步骤写入的安装根保持一致（shared:<root>/installed/x64-windows）。
          if [ "${{ matrix.vcpkg }}" = "true" ]; then
            flags="$flags -DAURORA_NET_TLS_PROVIDERS=shared:$RUNNER_TEMP/vcpkg/installed/x64-windows"
          fi
          if [ "${{ matrix.homebrew-openssl }}" = "true" ]; then
            flags="$flags -DAURORA_NET_TLS_PROVIDERS=shared:$OPENSSL_PREFIX"
          fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release $flags

      - name: Build (library + tools)
        run: cmake --build build --config Release --parallel

      - name: ccache stats
        run: ccache --show-stats --verbose || ccache --show-stats

      # 运行面只在「库已进可执行」的腿上取：静态 mbedTLS 编进二进制、macOS 系统栈走框架，都不必
      # 额外布置动态库；macOS provider 腿的 dylib 是 dyld 按安装名寻址，显式补一条搜索路径
      # （homebrew keg-only 不在默认 dyld 缓存路径上）；Windows 动态腿按上面的理由只证明链得上。
      - name: Test TLS suite
        if: matrix.os == 'ubuntu-26.04' || matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${OPENSSL_PREFIX:-}" ]; then
            export DYLD_LIBRARY_PATH="${OPENSSL_PREFIX}/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}"
          fi
          # 两套件各跑一次进程：注册表是进程级状态，`utest_net_tls_backend` 的桩注入与显式置链
          # 靠用例内的存还原收口，但把「真实握手」与「改写注册表」分开在两个进程里跑，才是
          # 共存形态运行期判据的干净读法。
          ./build/aurora_test_runner --run utest_net_tls_backend
          ./build/aurora_test_runner --run utest_net_tls

  # ---------------------------------------------------------------------------
  # 4. AddressSanitizer + UndefinedBehaviorSanitizer（全量 ctest）
  # ---------------------------------------------------------------------------
  asan:
    name: asan (ubuntu-gcc)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      # ASan 强制关 PCH（CMakeLists 的 AURORA_PCH_ENABLED 门控），消费者命令行无 PCH
      # 依赖，ccache 直接全量可缓存
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: asan-ubuntu-gcc

      # 网络能力开关：Inspector Server 与此前的静态 mbedTLS provider 都推进 ASan 的插桩面——
      # Inspector 的 worker 线程与 socket 生命周期、TLS 引擎的握手状态机，正是最该过一遍
      # AddressSanitizer + UBSan 的那批代码，此前它们连编译都没进这个作业。
      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DAURORA_ENABLE_ASAN=ON ${{ steps.net-flags.outputs.flags }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: ccache stats
        run: ccache --show-stats --verbose || ccache --show-stats

      # headless runner 无 X display、无剪贴板工具：装 xvfb 提供虚拟显示 + xclip/xsel，
      # 并用 xvfb-run 包裹 ctest，让依赖系统剪贴板的用例（如 itest_text_selection 的
      # Ctrl+C 复制）真正执行，而非因「剪贴板不可用」永久 SKIP。
      - name: Install virtual display + clipboard tools
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xclip xsel

      - name: Test (under virtual X display)
        # -LE e2e：本作业是纯 Headless 默认后端面（X11/GLFW 默认 OFF），E2E 无真实后端可跑、
        # 全部 skipped by policy，排除以省 ctest 时间；且真实图形栈与 ASan 的交互未评估，
        # 归后续增量（口径见 08-tooling §8.2「CI 作业口径」）。内核自测 utest_e2e_harness
        # 只用 HeadlessSurface，随全量用例照常执行。
        run: xvfb-run -a ctest --test-dir build --output-on-failure -C Release -LE e2e -j "$(nproc)"

  # ---------------------------------------------------------------------------
  # 5. 行覆盖率：coverage 聚合目标自带 ctest + gcov 终端摘要
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage (ubuntu-gcc)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      # 覆盖率构建同样强制关 PCH，ccache 直接全量可缓存；coverage 聚合目标内的
      # ctest 保持串行（gcda 并发写在非加锁平台有损坏风险）
      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: coverage-ubuntu-gcc

      # 与其余 Linux 作业同一口径：Inspector Server 与静态 mbedTLS provider 都打开，
      # 这两个目标此前不进覆盖率统计，打开后它们的行覆盖并入本作业产出的 `coverage` 报告。
      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release -DAURORA_ENABLE_COVERAGE=ON ${{ steps.net-flags.outputs.flags }}

      # headless runner 无 X display、无剪贴板工具：装 xvfb + xclip/xsel 提供虚拟显示，
      # 让 coverage 聚合目标内的 ctest 中依赖系统剪贴板的用例真正执行而非 SKIP。
      - name: Install virtual display + clipboard tools
        run: sudo apt-get update -y && sudo apt-get install -y xvfb xclip xsel

      - name: Build + ctest + gcov summary (coverage target, under virtual X display)
        run: xvfb-run -a cmake --build build --target coverage --parallel

      - name: ccache stats
        run: ccache --show-stats --verbose || ccache --show-stats

      - name: Upload coverage report (CSV + HTML)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage.csv
            build/coverage.html
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # 6. WebAssembly：Emscripten 工具链 + WASM 后端（库 + 测试 runner + ctest）
  # ---------------------------------------------------------------------------
  wasm:
    name: wasm (${{ matrix.name }})
    runs-on: ubuntu-26.04
    # 曾为浏览器口径 lint 从 120 抬到 180；那道 lint 现已拆到作业 8w 分片跑（单遍 69.7 分钟，
    # 占本作业 79.4 分钟里的绝大部分），本作业回到「configure + 构建 + ctest」，120 分钟有余。
    # 矩阵两腿：默认（WASM 单线程，AURORA_CAP_THREADS=0 支）与 pthreads-on（-pthread 真并行
    # 线程池，宿主页面须 COOP/COEP）——把 `AURORA_ENABLE_WASM_PTHREADS` 这个此前从未显式打开的
    # 宏真正编译并跑 wasm ctest，覆盖 `-pthread` 链接标志与 ThreadPool 行为分支。
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            cmake-flags: ""
          - name: pthreads-on
            cmake-flags: -DAURORA_ENABLE_WASM_PTHREADS=ON
    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      # wasm 口径：只取 Inspector Server（`setup-net-capability-flags` 的 `wasm` flavor 不装也不给
      # TLS provider——Emscripten 侧没有「含 include/ 与 lib/ 的安装根」，硬给即 configure 期 FATAL；
      # 本机实测 Inspector 目标在该配置下能产出 libaurora_inspector_server.a）。
      - name: Setup network capability flags (wasm flavor)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags
        with:
          flavor: wasm

      # AUDIO=ON 在 Emscripten 自动推导 AUDIO_WEBAUDIO=ON：Web Audio 设备后端此前只有
      # lint-wasm 静态分析、无编译覆盖，本命令使其在两腿各真编一次，utest_audio 亦在
      # wasm runner 下运行（无设备线程语义、推式环缓冲分支）。
      - name: Configure (emcmake)
        run: emcmake cmake -S . -B build-wasm -G Ninja -DCMAKE_BUILD_TYPE=Release -DAURORA_BACKEND_WASM=ON -DAURORA_BUILD_TESTS=ON -DAURORA_BUILD_DEMOS=OFF -DAURORA_ENABLE_AUDIO=ON ${{ matrix.cmake-flags }} ${{ steps.net-flags.outputs.flags }}

      - name: Build (library + tests)
        run: cmake --build build-wasm --parallel

      # Emscripten 的 socket shim 在 node 下运行时会 require('ws')。wasm 没有 BSD socket，
      # 依赖真实 socket / DNS 的用例已在 AURORA_PLATFORM_WASM 下整体跳过（见各 net 套件与
      # utest_net_resolver），正常情况下本模块不会被加载；装一层保险是因为漏网一处即令
      # runner 进程级崩于 MODULE_NOT_FOUND（整腿红、且报错离根因远）。npm 瞬时故障不应
      # 染红本就无需该模块的腿，故 continue-on-error。
      - name: Install ws (Emscripten socket shim insurance)
        continue-on-error: true
        run: npm install ws --no-save --prefix build-wasm

      # ctest 经 CMAKE_CROSSCOMPILING_EMULATOR（Emscripten.cmake 设为 node）驱动 .js runner。
      - name: Test (ctest)
        run: ctest --test-dir build-wasm --output-on-failure -j"$(nproc)"

      # 浏览器口径的 clang-tidy **不在本作业**：见作业 8w。留在这里的理由写下来免得有人再搬回——
      # 本作业要 emsdk 全量构建 + ctest，lint 单遍又是 70 分钟量级，两件事的失败原因毫无关系，
      # 合并只会让「测试红」与「排版红」共用一个 3 小时墙钟。拆出去后各片只 configure 不构建。

  # ---------------------------------------------------------------------------
  # 7. 安装 + find_package 消费端端到端验证
  # ---------------------------------------------------------------------------
  install-consumer:
    name: install + find_package (${{ matrix.name }})
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 默认配置：安装产物按发布态语义（AURORA_ENABLE_DEBUG=AUTO → 关）
          - name: default
            configure-flags: ""
          # 非默认宏一致性守护：Release 下强制 DEBUG=ON。该宏在 Widget 下新增数据成员、
          # **改变类内存布局**，消费端必须仅凭 find_package 导入的宏达成与库一致的 ABI；
          # 一旦安装导出面漏掉它即 ODR 违规 → 实测表现为渲染时段错误（SIGSEGV）。
          - name: debug-forced-on
            configure-flags: -DAURORA_ENABLE_DEBUG=ON
    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: install-${{ matrix.name }}

      # 安装态也开网络能力：Inspector Server 与 mbedTLS provider 都会改变 aurora 目标的链接面，
      # 而 `cmake --install` 只安装主库（`cmake/AuroraInstall.cmake` 不装 `aurora_inspector_server`），
      # 这里验证的是「这些目标在场时安装与 find_package 消费端依旧成立」，不是 exporter 面本身。
      - name: Setup network capability flags (Inspector + TLS provider)
        id: net-flags
        uses: ./.github/actions/setup-net-capability-flags

      - name: Configure + Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Release ${{ matrix.configure-flags }} ${{ steps.net-flags.outputs.flags }}
          cmake --build build --config Release --parallel

      - name: ccache stats
        run: ccache --show-stats --verbose || ccache --show-stats

      - name: Install
        run: cmake --install build --config Release --prefix "${{ github.workspace }}/install-prefix"

      # 端到端冒烟：find_package(Aurora) + 静态链接 + 伞头可编译（GUIDELINE §1 最小配方）
      - name: Consumer smoke (find_package + static link)
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(consumer_smoke CXX)
          set(CMAKE_CXX_STANDARD 20)
          find_package(Aurora REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE Aurora::aurora)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include "aurora/aurora.h"
          namespace au = aurora;
          int main() {
              // Node 从 Widget 派生对象接管所有权：Widget 拷贝构造已 delete，必须显式 std::move
              au::Node root = std::move(au::Text("Hello, Aurora!").font_size(20));
              au::Scene scene{ std::move(root) };
              [[maybe_unused]] const au::Result<bool> written = scene.render_to_png("hello.png", 200, 60);
          }
          EOF
          cmake -S consumer -B consumer/build -G Ninja -DCMAKE_PREFIX_PATH="${{ github.workspace }}/install-prefix"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer
          test -f hello.png

  # ---------------------------------------------------------------------------
  # 8. 静态检查门禁：clang-tidy 全量 lint（非 third_party 翻译单元，去重后 0 finding 才通过）
  # 版本钉死 clang-tidy-22，与本地 proved 组合（gcc 编译数据库 + clang-tidy 22.x → 0 findings）
  # 保持一致，避免不同 clang 版本漂移导致门禁误报。仅跑 ubuntu-26.04，因为
  # windows/macos 矩阵默认无 clang-tidy，且 lint 与平台无关（纯静态分析）。
  # 依赖 AuroraLint.cmake 提供的 `lint` 目标（需 configure 时 clang-tidy 在 PATH 上）。
  # 双 Pass：分别强制 -DAURORA_ENABLE_DEBUG=OFF / =ON，各自独立编译数据库，
  # 以覆盖 #if（debug-ON）与 #else（debug-OFF）两分支——
  # AURORA_ENABLE_DEBUG=AUTO 是 generator expression，单配置只分析一分支，门禁天然盲一半。
  #
  # 为什么要摊成矩阵：这两遍原本在**同一个 job 里串跑**，而 runner 只有 4 vCPU —— 单遍实测 498 TU / 5172s = 86 分钟，
  # 两遍串跑就是 3 小时量级，`timeout-minutes: 240` 根本不够，红灯是必然、不是偶发。
  # runner 侧的并行度早已开满核数，所以**唯一还能动的量是把 TU 分到多个作业**：
  # pass(2) × shard(4) = 8 个作业，每片约 125 TU ≈ 22 分钟，整门墙钟 86 → ~25 分钟。
  # ⚠️ 分片只改排布、不减覆盖面：总核时与原来一模一样（该跑的 TU 一个不少）。
  # ⚠️ 判据随矩阵改写为「8 个作业全绿」：任一片红即整门红；`fail-fast: false` 让其余片继续跑完，
  # 好让一次 push 就看到整张告警面，而不是修一片再看一片。缺片（作业被跳过或没配出来）等于
  # 缺覆盖面，故每片的 lint-findings.json 自带 `shard` / `tu_total` 字段供聚合核对。
  # 改片数须同时动两处：下面的 `shard: [0, 1, 2, 3]` 与 `total: [4]`（矩阵表达式取不到某维度
  # 的取值列表，job name 里又用不了 `env`，只能把总数单列成一个取值维度当引用点）。
  # 两处不一致的后果不对称，都响：列表比 total 长 → 越界片在 configure 期 FATAL_ERROR；
  # 列表比 total 短 → 那几片**没人跑**，门禁只剩部分覆盖面。后者只能靠本注释与每片 JSON 里的
  # `tu_total` 自述字段核对，加聚合作业不值当（多一个作业、多一处会红的无关依赖）。
  # ---------------------------------------------------------------------------
  lint:
    name: clang-tidy (${{ matrix.pass.label }}, shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-26.04
    # 240 → 40：每片 ~140 TU ≈ 24 分钟 tidy，加 apt 安装 / configure / lint-prereq ≈ 4 分钟；40 分钟是
    # 一倍半余量。余量必须留：本轮 TU 编译失败即整片红，慢起来没有上限。
    # 全量矩阵只跑 PR / master(+main) / 每周定时 / 手动触发；分支推送改由下方 lint-incremental
    # 单 job 增量覆盖（见作业 8i），避免每个功能分支 push 都发 12 个 native lint job。
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        pass:
          - label: debug-off
            debug: "OFF"
            flags: ""
          - label: debug-on
            debug: "ON"
            flags: ""
          # 反极性遍：架构级优化开关全部关闭（layout 缓存 / 遮挡剔除 / Display List / SIMD）
          # 与测试注入点关闭——这些 `#ifdef` 收口的分支在默认三开关全开时根本不参与分析。
          # 与上方两遍共用同一份扩面后端/能力开关（见 Configure 步骤）。
          # 本 pass 另在 env 串的内置 mbedTLS 之外追加一条 OpenSSL provider（shared:/usr）：两枚引擎 TU
          # （tls_mbedtls.cpp / tls_openssl.cpp）各自进一个 pass 的分析面，不新增 job。
          - label: optimizations-off
            debug: "OFF"
            flags: -DAURORA_ENABLE_LAYOUT_CACHE=OFF -DAURORA_ENABLE_OCCLUSION_CULLING=OFF -DAURORA_ENABLE_DISPLAY_LIST=OFF -DAURORA_ENABLE_SIMD=OFF -DAURORA_ENABLE_TEST_HOOKS=OFF -DAURORA_NET_TLS_PROVIDERS=shared:/usr
        shard: [0, 1, 2, 3]
        # 单值维度：只为给 `--shard=i/n` 的 n 一个 yaml 内的引用点（见上方注释）。
        total: [4]
    steps:
      - uses: actions/checkout@v7
      - name: Install clang-tidy-22 + desktop backend dev dependencies
        run: |
          sudo wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          # http 为 apt.llvm.org 官方源格式：包完整性由上方 GPG 签名验证，非 TLS
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -y
          # clang-format-22 一并装上：aurora_find_clang_format 在 configure 期要找一个读得懂
          # 本仓 .clang-format 的版本，缺它则 format 目标与生成链静默降级（见 BUILD_OPTIONS.md §4.7）。
          # 其后是扩面所需的后端开发包（X11 / Wayland / GLFW 的 configure 依赖）：主 Linux 遍
          # 要打开 X11/Wayland/GLFW，缺这些包 configure 期直接 FATAL。ALSA 音频走运行期 dlopen、
          # 无 dev 包依赖（见 AuroraBackends.cmake 音频段），故不在列表里。
          # libclang1-22：wgpu-native 的 bindgen 由 configure 期探测 libclang 共享库，clang-tidy-22
          # 只拉 libclang-cpp22（C++ 接口）不含 C 接口的 libclang-22.so.1，故显式补装。
          # mbedTLS 现由仓库内置源码构建（AURORA_ENABLE_NET_TLS_MBEDTLS，源码随 checkout 就位），无需
          # libmbedtls-dev、也不再搭 /opt provider 根；libssl-dev 供 optimizations-off pass 的 OpenSSL 腿。
          sudo apt-get install -y clang-tidy-22 clang-format-22 libclang1-22 \
            libx11-dev libxfixes-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libssl-dev
          sudo ln -sf /usr/bin/clang-tidy-22 /usr/local/bin/clang-tidy
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format

      # AURORA_BACKEND_GPU_WGPU=ON 的 configure 期硬探测 cargo / rustc（见 AuroraBackends.cmake）；
      # 运行器镜像通常已预装 Rust，存在即跳过，缺失时才经 rustup 装最小 stable。
      - name: Ensure Rust toolchain (wgpu backend configure probe)
        run: |
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version || true
          rustc -vV || true

      # AURORA_LINT_SHARD 只在 configure 期烧进 `lint` 目标的命令行（见 AuroraLint.cmake），
      # 且格式非法 / 索引越界会当场 FATAL_ERROR——分片配错的症状是「某片没人跑」，必须早响。
      # 全量 / 增量的分界：master 推送、每周定时与手动触发跑全量；PR 与功能分支推送走增量。
      # 增量需要的「改动清单」来自 git：PR 取与基线的三点差异，push 取 `github.event.before`
      # 与当前 SHA 的两点差异。两者都要显式补 fetch——默认 checkout 是 depth=1 的浅克隆，
      # 基线提交不在本地；取不到基线的后果不是「少跑一点」，而是无从判断改动面，故一律
      # **退化为全量**并留 warning，绝不退化成空集（空集会被读成「本片干净」）。
      - name: Decide lint scope
        id: scope
        run: |
          set -euo pipefail
          full=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) full=true ;;
            pull_request) full=true ;;
            *) case "${{ github.ref }}" in refs/heads/master|refs/heads/main) full=true ;; esac ;;
          esac
          if [ "$full" != "true" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git -c core.quotepath=off fetch --depth=1 origin \
                "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              git -c core.quotepath=off diff --name-only "origin/${{ github.base_ref }}..." > changed.txt
            else
              before="${{ github.event.before }}"
              git -c core.quotepath=off fetch --depth=1 origin "$before" 2>/dev/null || true
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                full=true
                echo "::warning::previous commit unavailable; falling back to a full lint pass"
              else
                git -c core.quotepath=off diff --name-only "$before" "${{ github.sha }}" > changed.txt
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" != "true" ]; then
            echo "incremental scope: $(wc -l < changed.txt) changed files"
          else
            echo "full scope: every TU in this compile database"
          fi

      # 扩面：主 Linux 遍打开除 Windows/macOS 特有宏之外的全部后端与能力开关，让
      # `#ifdef AURORA_BACKEND_X11/WAYLAND/GLFW`、GPU（GL / wgpu-native）、音频、SQLite、图像编解码、
      # WebView 控件、Inspector Server、性能观测（PROFILING/TRACING）与 verify 探针都进入分析面。
      # 开关串维护在顶层 env 的 LINT_CAPABILITY_FLAGS（四处 lint 腿共用，防粘贴漂移）。
      # `matrix.pass.flags` 追加反极性遍的优化开关收口。
      # ⚠️ AURORA_BACKEND_GPU_WGPU=ON 只做 configure 期工具链探测（cargo/rustc/libclang），lint 目标
      #    不构建 wgpu_native_build，故无需真正跑 cargo 编译。
      - name: Configure (${{ matrix.pass.label }}, export compile_commands.json)
        run: |
          cmake -S . -B build-lint -G Ninja \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON \
            -DAURORA_ENABLE_DEBUG=${{ matrix.pass.debug }} \
            -DAURORA_LINT_SHARD=${{ matrix.shard }}/${{ matrix.total }} \
            ${{ env.LINT_CAPABILITY_FLAGS }} \
            ${{ matrix.pass.flags }}

      # 生成物就位：lint 只 configure 不构建，而被分析的 TU 会 include 构建期产物——wayland-scanner
      # 产出的协议头（<build>/wayland-gen/*-client-protocol.h）、词表生成头（<build>/<target>_i18n/
      # messages_*.hpp）。缺头即撞一条 clang-diagnostic-error 并把真实检查全吞掉，门禁如实判红。
      # 先决清单收敛在 `lint-prereq`（cmake/AuroraLint.cmake），秒级完成，全量与（生产不可达的）
      # 失效增量分支都需要，故无条件跑。
      - name: Build lint prerequisites
        run: cmake --build build-lint --target lint-prereq

      # 选集必须在 configure 之后：它读的就是这份编译库。全量时跳过（那份清单只有增量用得上）。
      # ⚠️ 本分支在生产中不可达——本作业的 `if:` 已排除「非 master 分支 push」，故 steps.scope 恒为
      #    full=true；唯一的分支推送增量入口是作业 8i。这里保留 `--changed-only` 只为万一被改回可达时
      #    不误跑闭包全量（闭包展开会把一次小改动放大成近整库）。
      - name: Select affected translation units
        if: steps.scope.outputs.full != 'true'
        run: |
          set -euo pipefail
          python3 tools/check/select_lint_tus.py --build-dir build-lint --changed changed.txt --changed-only \
            --out-dir build-lint/lint-selection --shards ${{ matrix.total }} --min-tu-per-shard 40 --jobs 4
          cat build-lint/lint-selection/selection.json

      # 结果缓存（方案 C）：按「TU 内容 + 依赖内容 + 编译器/tidy 版本 + 配置 + 编译 argv」的
      # 指纹复用上一次的输出。改了什么就只重算受牵动的那批，其余跨 PR 直接复放。
      - name: Restore tidy result cache
        uses: actions/cache@v6
        with:
          path: .tidy-cache
          key: aurora-tidy-${{ matrix.pass.label }}-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aurora-tidy-${{ matrix.pass.label }}-${{ runner.os }}-

      - name: Lint (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.full }}" = "true" ]; then
            cmake --build build-lint --target lint
            exit 0
          fi
          list="build-lint/lint-selection/tus_${{ matrix.shard }}.txt"
          if [ ! -s "$list" ]; then
            # 空片只在增量模式下合法（子集不够摊满 4 片，脚本已按 --min-tu-per-shard 少分片）。
            # 必须留痕：「没活儿」与「跑过且干净」在日志里长得一模一样。
            printf '{"idle":true,"mode":"incremental","shard":[%s,%s],"tu_count":0,"tu_total":0,"unique_findings":0,"broken_tus":[],"by_check":[],"by_file":[],"findings":[]}\n' \
              "${{ matrix.shard }}" "${{ matrix.total }}" > build-lint/lint-findings.json
            echo "incremental: no TU assigned to shard ${{ matrix.shard }} (subset smaller than the shard count)"
            exit 0
          fi
          python3 tools/check/run_clang_tidy.py --build-dir build-lint \
            --tu-list "$list" \
            --deps build-lint/lint-selection/deps.json \
            --cache-dir .tidy-cache \
            --json-out build-lint/lint-findings.json --jobs 4

      # 增量片的 JSON 补上 `shard` / `tu_total`：判「片数齐没齐」读的是这两个字段，
      # 与全量片保持同形，聚合时才不需要区分两种来源。
      - name: Annotate findings with shard scope
        if: steps.scope.outputs.full != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sel_p = "build-lint/lint-selection/selection.json"
          out_p = "build-lint/lint-findings.json"
          sel = json.load(open(sel_p, encoding="utf-8"))
          data = json.load(open(out_p, encoding="utf-8"))
          data["shard"] = [int(os.environ["SHARD"]), int(os.environ["TOTAL"])]
          data["tu_total"] = sel["selected_count"]
          data["selection_mode"] = sel["mode"]
          json.dump(data, open(out_p, "w", encoding="utf-8"), indent=1)
          PY

      - name: Upload tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidy-findings-${{ matrix.pass.label }}-shard${{ matrix.shard }}
          path: build-lint/lint-findings.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 8w. 浏览器口径 clang-tidy：Emscripten 编译库上的同一道门禁，同样按 TU 分片。
  # 为什么非要有这一遍：native 门禁（作业 8）的两份编译库里根本没有 `EMSCRIPTEN` 门后的
  # TU —— wasm_* 实现、Web Audio 后端、wasm 探针，以及各文件里 `#ifdef AURORA_BACKEND_WASM`
  # 包住的分支都不参与分析。作业 8 全绿不构成这些代码被检查过的证据。
  # AuroraLint 在 Emscripten 配置下自动给 `lint` 附加 --emscripten：runner 先把 em++ 写的
  # 编译库重写成 native clang-tidy 能消费的形态（换 wasm 三元组、指 sysroot、弃 PCH、补驱动宏），
  # 再走同一套并行 / 去重 / 汇总流程——两种口径的产物因此可比。
  # ⚠️ 本作业**只 configure 不构建**：`lint` 目标只要 compile_commands.json + sysroot，
  #    不链库。这与作业 8 一直以来的跑法一致，且成立的前提是仓库内所有生成物
  #    （error_codes.gen.h / aurora_api.json）都落在源码树并已提交——若日后新增
  #    「构建目录里生成、又被 TU include」的头，分片作业会因找不到文件而报 broken_tus，
  #    届时要么把生成物提交进源码树，要么在本作业补一步 configure 期生成目标。
  # ---------------------------------------------------------------------------
  lint-wasm:
    name: clang-tidy (wasm, shard ${{ matrix.shard }}/${{ matrix.total }})
    runs-on: ubuntu-26.04
    # 40：单片 ~17 分钟 tidy + emsdk/apt/configure ~4 分钟，留一倍余量。
    # 与作业 8 同一套门禁分流：全量矩阵只在 PR / master(+main) / 定时 / 手动触发；分支推送
    # 由 lint-incremental 单 job 覆盖浏览器口径的增量子集。
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
        # 单值维度：给 `--shard=i/n` 的 n 一个引用点（同作业 8，改片数须与 shard 列表同步）。
        total: [4]
    steps:
      - uses: actions/checkout@v7

      # 让 aurora_find_clang_format 在本作业探测成功：发行版与旧 patch 构建读不懂本仓
      # .clang-format 的枚举取值，探测全落空即静默降级（format 目标不生成、生成链换二进制），
      # 口径与实测见 codespec/BUILD_OPTIONS.md §4.7。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      # ⚠️ 安装必须在 Configure **之前**：AuroraLint.cmake 在 configure 阶段 find_program(clang-tidy)，
      #    找不到就直接 return——`lint` 目标根本不会被定义，届时构建只会报
      #    "no rule to make target 'lint'"。与作业 8 同款钉版本 22：不同 clang 大版本的检查集会
      #    漂移，两种口径的清单必须可比。（安装块与作业 8 重复——workflow 不支持 YAML 锚点复用。）
      - name: Install clang-tidy-22
        run: |
          sudo wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          # http 为 apt.llvm.org 官方源格式：包完整性由上方 GPG 签名验证，非 TLS
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -y
          # clang-format-22 一并装上：aurora_find_clang_format 在 configure 期要找一个读得懂
          # 本仓 .clang-format 的版本，缺它则 format 目标与生成链静默降级（见 BUILD_OPTIONS.md §4.7）。
          sudo apt-get install -y clang-tidy-22 clang-format-22
          sudo ln -sf /usr/bin/clang-tidy-22 /usr/local/bin/clang-tidy
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format

      # configure 的**能力开关**与作业 8 对齐（音频 / SQLite / 图像编解码 / WebView / Inspector
      # Server），只去掉 native 后端（X11/Wayland/GLFW 在 wasm 下无意义）——开关串维护在顶层
      # env 的 LINT_CAPABILITY_FLAGS_WASM；换开关等于换覆盖面，扩面后本作业的 TU 清单较历史
      # 基线（首轮 420 TU / 470 条）有增量，属预期。
      # 与作业 8 同一套全量 / 增量分界（workflow 不支持 YAML 锚点复用，故同款块写两份）。
      # 浏览器口径的编译库是另一张 TU 清单，选集必须在本作业的编译库上重算一遍，
      # 不能复用 native 那份：`EMSCRIPTEN` 门后的 TU 与 `AURORA_BACKEND_WASM` 分支只在
      # 这里存在，拿 native 的清单来跑会正好把它们漏掉。
      - name: Decide lint scope
        id: scope
        run: |
          set -euo pipefail
          full=false
          case "${{ github.event_name }}" in
            schedule|workflow_dispatch) full=true ;;
            pull_request) full=true ;;
            *) case "${{ github.ref }}" in refs/heads/master|refs/heads/main) full=true ;; esac ;;
          esac
          if [ "$full" != "true" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              git -c core.quotepath=off fetch --depth=1 origin \
                "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
              git -c core.quotepath=off diff --name-only "origin/${{ github.base_ref }}..." > changed.txt
            else
              before="${{ github.event.before }}"
              git -c core.quotepath=off fetch --depth=1 origin "$before" 2>/dev/null || true
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ] \
                 || ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
                full=true
                echo "::warning::previous commit unavailable; falling back to a full lint pass"
              else
                git -c core.quotepath=off diff --name-only "$before" "${{ github.sha }}" > changed.txt
              fi
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          if [ "$full" != "true" ]; then
            echo "incremental scope: $(wc -l < changed.txt) changed files"
          else
            echo "full scope: every TU in this compile database"
          fi

      - name: Configure (emcmake, export compile_commands.json)
        run: emcmake cmake -S . -B build-wasm-lint -G Ninja -DCMAKE_BUILD_TYPE=Release -DAURORA_BACKEND_WASM=ON -DAURORA_BUILD_TESTS=ON -DAURORA_BUILD_DEMOS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON -DAURORA_LINT_SHARD=${{ matrix.shard }}/${{ matrix.total }} ${{ env.LINT_CAPABILITY_FLAGS_WASM }}

      # 选集必须在 configure 之后：它读的就是这份编译库。全量时跳过（那份清单只有增量用得上）。
      # ⚠️ 与作业 8 同理，本分支在生产中不可达（`if:` 已排除非 master 分支 push），唯一的分支推送
      #    增量入口是作业 8i；保留 `--changed-only` 只为万一被改回可达时不误跑闭包全量。
      - name: Select affected translation units
        if: steps.scope.outputs.full != 'true'
        run: |
          set -euo pipefail
          python3 tools/check/select_lint_tus.py --build-dir build-wasm-lint --changed changed.txt --changed-only \
            --out-dir build-wasm-lint/lint-selection --shards ${{ matrix.total }} --min-tu-per-shard 40 --jobs 4
          cat build-wasm-lint/lint-selection/selection.json

      - name: Restore tidy result cache
        uses: actions/cache@v6
        with:
          path: .tidy-cache
          key: aurora-tidy-wasm-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            aurora-tidy-wasm-${{ runner.os }}-

      - name: Lint (shard ${{ matrix.shard }}/${{ matrix.total }})
        run: |
          set -euo pipefail
          if [ "${{ steps.scope.outputs.full }}" = "true" ]; then
            cmake --build build-wasm-lint --target lint
            exit 0
          fi
          list="build-wasm-lint/lint-selection/tus_${{ matrix.shard }}.txt"
          if [ ! -s "$list" ]; then
            printf '{"idle":true,"mode":"incremental","shard":[%s,%s],"tu_count":0,"tu_total":0,"unique_findings":0,"broken_tus":[],"by_check":[],"by_file":[],"findings":[]}\n' \
              "${{ matrix.shard }}" "${{ matrix.total }}" > build-wasm-lint/lint-findings.json
            echo "incremental: no TU assigned to shard ${{ matrix.shard }} (subset smaller than the shard count)"
            exit 0
          fi
          python3 tools/check/run_clang_tidy.py --build-dir build-wasm-lint --emscripten \
            --tu-list "$list" \
            --deps build-wasm-lint/lint-selection/deps.json \
            --cache-dir .tidy-cache \
            --json-out build-wasm-lint/lint-findings.json --jobs 4

      - name: Annotate findings with shard scope
        if: steps.scope.outputs.full != 'true'
        env:
          SHARD: ${{ matrix.shard }}
          TOTAL: ${{ matrix.total }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          sel_p = "build-wasm-lint/lint-selection/selection.json"
          out_p = "build-wasm-lint/lint-findings.json"
          sel = json.load(open(sel_p, encoding="utf-8"))
          data = json.load(open(out_p, encoding="utf-8"))
          data["shard"] = [int(os.environ["SHARD"]), int(os.environ["TOTAL"])]
          data["tu_total"] = sel["selected_count"]
          data["selection_mode"] = sel["mode"]
          json.dump(data, open(out_p, "w", encoding="utf-8"), indent=1)
          PY

      - name: Upload tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidy-findings-wasm-shard${{ matrix.shard }}
          path: build-wasm-lint/lint-findings.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 8i. 增量 lint（分支推送专用）：单 job 内顺序覆盖 native(DEBUG OFF/ON) 与 wasm 三套
  # 编译库上「本次改动牵动的 TU」。只在 push 到非 master/main 分支时跑；PR 与 master 推送
  # 走上方全量矩阵（作业 8 / 8w）。
  # 为什么是单 job 而非矩阵：分支推送改动通常很小，单 job 内对受牵动子集跑三遍足矣，不必为
  # 每个分片各发一个 runner；分片矩阵是给全量（每遍 556 TU）降墙钟用的。三套编译库的子集
  # 各自独立计算，不能互用（EMSCRIPTEN 门后 TU 只在 wasm 库存在）。
  # 改动面来源：正常 push 取 `before..sha` 两点差异；首推 / 强推导致 `before` 不可用
  # 时回落到「相对 origin/master 的差异」，仍是有界子集（分支相对 master 的净改动）而非全量。
  # 选集口径与作业 8/8w **不同**：本 job 走 `select_lint_tus.py --changed-only`，只跑改动集里
  # 本身就是 TU 的文件（不展开 include 闭包），求快；闭包级完整覆盖留给 PR / master 的作业
  # 8 / 8w。故改一个公共头不会在本 job 顺带重跑它的包含者——那部分告警由全量 lint 兜底。
  # ---------------------------------------------------------------------------
  lint-incremental:
    name: clang-tidy (incremental, push)
    runs-on: ubuntu-26.04
    # 单 job 串三遍：子集小时约 5–15 分钟；回落 origin/master 差异或触发全局全量时可能放大，
    # 留一倍余量。
    timeout-minutes: 90
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' && github.event_name == 'push' && github.ref != 'refs/heads/master' && github.ref != 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      - name: Install clang-tidy-22 + desktop backend dev dependencies
        run: |
          sudo wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/apt.llvm.org.asc] http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-22 main" | sudo tee /etc/apt/sources.list.d/llvm22.list
          sudo apt-get update -y
          # clang-format-22 与扩面所需的后端开发包（X11/Wayland/GLFW 的 configure 依赖）一并装上，
          # 与作业 8 同口径。ALSA 走运行期 dlopen，无 dev 包依赖。libclang1-22 见作业 8 同名步骤说明。
          # mbedTLS 现由仓库内置源码构建（AURORA_ENABLE_NET_TLS_MBEDTLS，源码随 checkout 就位）：无需
          # libmbedtls-dev，也不再搭 /opt provider 根。
          sudo apt-get install -y clang-tidy-22 clang-format-22 libclang1-22 \
            libx11-dev libxfixes-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libwayland-dev wayland-protocols libxkbcommon-dev
          sudo ln -sf /usr/bin/clang-tidy-22 /usr/local/bin/clang-tidy
          sudo ln -sf /usr/bin/clang-format-22 /usr/local/bin/clang-format

      # 与作业 8 同口径：wgpu 后端的 configure 期硬探测 cargo / rustc；镜像预装则跳过。
      - name: Ensure Rust toolchain (wgpu backend configure probe)
        run: |
          if ! command -v cargo >/dev/null 2>&1 || ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          cargo --version || true
          rustc -vV || true

      - name: Compute changed files (push scope)
        id: changed
        run: |
          set -euo pipefail
          zero="0000000000000000000000000000000000000000"
          before="${{ github.event.before }}"
          if [ -n "$before" ] && [ "$before" != "$zero" ]; then
            git -c core.quotepath=off fetch --depth=1 origin "$before" 2>/dev/null || true
          fi
          if [ -n "$before" ] && [ "$before" != "$zero" ] && git cat-file -e "${before}^{commit}" 2>/dev/null; then
            git -c core.quotepath=off diff --name-only "$before" "${{ github.sha }}" > changed.txt
            echo "scope=push" >> "$GITHUB_OUTPUT"
          else
            # 首推 / 强推：回落到「相对 origin/master 的净改动」，仍是有界子集
            git -c core.quotepath=off fetch --depth=1 origin master 2>/dev/null || true
            git -c core.quotepath=off diff --name-only origin/master "${{ github.sha }}" > changed.txt
            echo "scope=fork" >> "$GITHUB_OUTPUT"
          fi
          echo "incremental scope: $(wc -l < changed.txt) changed files"

      - name: Lint native (DEBUG=OFF)
        run: |
          set -euo pipefail
          cmake -S . -B build-lint-off -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON -DAURORA_ENABLE_DEBUG=OFF \
            ${{ env.LINT_CAPABILITY_FLAGS }}
          cmake --build build-lint-off --target lint-prereq
          python3 tools/check/select_lint_tus.py --build-dir build-lint-off --changed changed.txt --changed-only --out-dir build-lint-off/sel --shards 1
          list=build-lint-off/sel/tus_0.txt
          if [ ! -s "$list" ]; then
            printf '{"idle":true,"mode":"incremental","pass":"DEBUG=OFF","tu_count":0,"unique_findings":0,"broken_tus":[],"findings":[]}\n' > build-lint-off/findings.json
          else
            python3 tools/check/run_clang_tidy.py --build-dir build-lint-off --tu-list "$list" --deps build-lint-off/sel/deps.json --cache-dir .tidy-cache-off --json-out build-lint-off/findings.json --jobs 4
          fi
          python3 - <<'PY'
          import json
          p="build-lint-off/findings.json"
          d=json.load(open(p, encoding="utf-8"))
          d.setdefault("pass", "DEBUG=OFF"); d["mode"] = "incremental"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=1)
          PY

      - name: Lint native (DEBUG=ON)
        run: |
          set -euo pipefail
          cmake -S . -B build-lint-on -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON -DAURORA_ENABLE_DEBUG=ON \
            ${{ env.LINT_CAPABILITY_FLAGS }}
          cmake --build build-lint-on --target lint-prereq
          python3 tools/check/select_lint_tus.py --build-dir build-lint-on --changed changed.txt --changed-only --out-dir build-lint-on/sel --shards 1
          list=build-lint-on/sel/tus_0.txt
          if [ ! -s "$list" ]; then
            printf '{"idle":true,"mode":"incremental","pass":"DEBUG=ON","tu_count":0,"unique_findings":0,"broken_tus":[],"findings":[]}\n' > build-lint-on/findings.json
          else
            python3 tools/check/run_clang_tidy.py --build-dir build-lint-on --tu-list "$list" --deps build-lint-on/sel/deps.json --cache-dir .tidy-cache-on --json-out build-lint-on/findings.json --jobs 4
          fi
          python3 - <<'PY'
          import json
          p="build-lint-on/findings.json"
          d=json.load(open(p, encoding="utf-8"))
          d.setdefault("pass", "DEBUG=ON"); d["mode"] = "incremental"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=1)
          PY

      - name: Setup Emscripten
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: latest

      - name: Lint wasm
        run: |
          set -euo pipefail
          emcmake cmake -S . -B build-wasm-lint -G Ninja -DCMAKE_BUILD_TYPE=Release -DAURORA_BACKEND_WASM=ON -DAURORA_BUILD_TESTS=ON -DAURORA_BUILD_DEMOS=OFF -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON ${{ env.LINT_CAPABILITY_FLAGS_WASM }}
          python3 tools/check/select_lint_tus.py --build-dir build-wasm-lint --changed changed.txt --changed-only --out-dir build-wasm-lint/sel --shards 1
          list=build-wasm-lint/sel/tus_0.txt
          if [ ! -s "$list" ]; then
            printf '{"idle":true,"mode":"incremental","pass":"wasm","tu_count":0,"unique_findings":0,"broken_tus":[],"findings":[]}\n' > build-wasm-lint/findings.json
          else
            python3 tools/check/run_clang_tidy.py --build-dir build-wasm-lint --emscripten --tu-list "$list" --deps build-wasm-lint/sel/deps.json --cache-dir .tidy-cache-wasm --json-out build-wasm-lint/findings.json --jobs 4
          fi
          python3 - <<'PY'
          import json
          p="build-wasm-lint/findings.json"
          d=json.load(open(p, encoding="utf-8"))
          d.setdefault("pass", "wasm"); d["mode"] = "incremental"
          json.dump(d, open(p, "w", encoding="utf-8"), indent=1)
          PY

      - name: Upload tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidy-findings-incremental
          path: |
            build-lint-off/findings.json
            build-lint-on/findings.json
            build-wasm-lint/findings.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 8win. Windows 平台 lint 子作业：主 Linux 遍开不了 Windows 特有编译选项
  #   （AURORA_BACKEND_WIN32 / D3D11 / AUDIO_WASAPI 与 `_WIN32` 分支只在 Windows 存在），
  #   本作业用 MSYS2 mingw 编译库**只扫平台相关 TU**（git grep 按平台 token 定向选集），不扫全仓。
  #   clang-tidy 钉 LLVM 22 官方 tarball（与主遍 apt.llvm.org 22 同大版本，检查集可比）。
  #   Windows 每周定时额外跑一遍**全量**（覆盖「平台 TU 长期没被 token 选中」的系统性缺口）。
  # ---------------------------------------------------------------------------
  lint-windows:
    name: clang-tidy (windows, platform TUs)
    runs-on: windows-latest
    timeout-minutes: 90
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    env:
      # 本作业的若干工具步打印中文（tools/check/*.py）：cp1252 控制台编码无法表示，强制 UTF-8。
      PYTHONUTF8: 1
    steps:
      - uses: actions/checkout@v7

      # windows-latest 自带 MSYS2 mingw-w64 工具链；choco mingw 路径作后备（口径同 core 作业）。
      - name: Setup MinGW toolchain
        shell: bash
        run: |
          for d in /c/msys64/mingw64/bin "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then echo "$d" >> "$GITHUB_PATH"; break; fi
          done
          gcc --version

      # clang-tidy 22：取 LLVM 官方 Windows tarball（curl + 7z 解包，无需安装器），与主 Linux 遍
      # 同大版本——检查集随 clang 大版本漂移，两侧必须量同一套。
      - name: Install LLVM 22 (clang-tidy)
        shell: pwsh
        run: |
          $url = "https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/clang+llvm-22.1.8-x86_64-pc-windows-msvc.tar.xz"
          $out = Join-Path $env:RUNNER_TEMP "llvm.tar.xz"
          Invoke-WebRequest -Uri $url -OutFile $out
          $dest = Join-Path $env:RUNNER_TEMP "llvm"
          $sevenZip = "C:\Program Files\7-Zip\7z.exe"
          & $sevenZip x $out "-o$dest" -y | Out-Null
          & $sevenZip x (Join-Path $dest "llvm.tar") "-o$dest" -y | Out-Null
          # 不写死解包目录名：tarball 顶层目录随 LLVM 版本/发行形态变化，按二进制实际位置定位更稳。
          $bin = (Get-ChildItem -Path $dest -Recurse -Filter "clang-tidy.exe" | Select-Object -First 1).DirectoryName
          if (-not $bin) { throw "clang-tidy.exe not found after extracting $url" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin "clang-tidy.exe") --version

      - name: Configure (mingw, export compile_commands.json)
        run: cmake -S . -B build-lint -G Ninja -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DAURORA_ENABLE_CLANG_TIDY=ON -DAURORA_ENABLE_DEBUG=OFF -DAURORA_BACKEND_WIN32=ON -DAURORA_BACKEND_D3D11=ON -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_STORAGE_SQLITE=ON -DAURORA_ENABLE_IMAGE_JPEG=ON -DAURORA_ENABLE_IMAGE_WEBP=ON -DAURORA_ENABLE_IMAGE_PNG=ON -DAURORA_ENABLE_WEBVIEW=ON -DAURORA_BUILD_INSPECTOR_SERVER=ON -DAURORA_BUILD_VERIFY_TOOLS=ON

      # 定向选集：按平台 token 从第一方源码里挑出 Windows 相关文件，再交由选集脚本保留其中
      # 「本身就是 TU」的那些（--changed-only）。只扫平台相关代码，不扫全仓。
      - name: Select Windows platform TUs
        shell: bash
        run: |
          set -euo pipefail
          git -c core.quotepath=off grep -lE 'AURORA_PLATFORM_WINDOWS|AURORA_BACKEND_WIN32|AURORA_ENABLE_AUDIO_WASAPI|AURORA_BACKEND_D3D11|AURORA_UIA|_WIN32|WINAPI|HWND|HMODULE|windows\.h|winnt\.h|shell32' -- src tools tests examples include | sort > win-tus.txt
          echo "platform token files: $(wc -l < win-tus.txt)"
          python3 tools/check/select_lint_tus.py --build-dir build-lint --changed win-tus.txt --changed-only --out-dir build-lint/sel --shards 1
          cat build-lint/sel/selection.json

      - name: Lint Windows platform TUs
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # 每周定时：Windows 全量（覆盖「平台 TU 长期没被 token 选中」的系统性缺口）。
            cmake --build build-lint --target lint
            exit 0
          fi
          list=build-lint/sel/tus_0.txt
          if [ ! -s "$list" ]; then
            echo "::error::windows lint selection is empty - the platform token list matched no translation unit"
            exit 1
          fi
          python3 tools/check/run_clang_tidy.py --build-dir build-lint --tu-list "$list" --json-out build-lint/findings.json --jobs "$(nproc)"

      - name: Upload tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidy-findings-windows
          path: build-lint/findings.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 8mac. macOS 平台 lint 子作业：主 Linux 遍开不了 macOS 特有选项（AURORA_BACKEND_MACOS 与
  #   `__APPLE__` 分支只在 Apple 平台存在）。与 8win 同构：Apple 工具链编译库 + 平台 token
  #   定向选集 + LLVM 22 tarball（macOS 官方资产仅 ARM64，与 macos-latest runner 架构一致）。
  # ---------------------------------------------------------------------------
  lint-macos:
    name: clang-tidy (macos, platform TUs)
    runs-on: macos-latest
    timeout-minutes: 60
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' && (github.event_name != 'push' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') }}
    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM 22 (clang-tidy)
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/llvm/llvm-project/releases/download/llvmorg-22.1.8/LLVM-22.1.8-macOS-ARM64.tar.xz"
          curl -fsSL "$url" -o "$RUNNER_TEMP/llvm.tar.xz"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$RUNNER_TEMP"
          # 不写死解包目录名：tarball 顶层目录随 LLVM 发行形态变化，按二进制实际位置定位更稳。
          bin="$(dirname "$(find "$RUNNER_TEMP" -type f -name clang-tidy -path '*/bin/*' | head -1)")"
          if [ -z "$bin" ] || [ "$bin" = "." ]; then
            echo "::error::clang-tidy not found after extracting $url"
            exit 1
          fi
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/clang-tidy" --version

      - name: Configure (export compile_commands.json)
        # 本作业**只 configure 不 build**，故 PCH 产物不存在；而 clang 侧 AURORA_PCH_ENABLED 默认 ON，
        # clang-tidy 会因 `PCH file ... cmake_pch.hxx.pch not found` 把每个 TU 判为 broken。此处为
        # 「仅 lint」的 configure 关掉 PCH，使 compile_commands.json 不带 -include-pch
        #（基于 GCC 的 lint 作业本就是 PCH-off，不受影响）。
        run: cmake -S . -B build-lint -G Ninja -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DCMAKE_DISABLE_PRECOMPILE_HEADERS=ON -DAURORA_ENABLE_CLANG_TIDY=ON -DAURORA_ENABLE_DEBUG=OFF -DAURORA_BACKEND_MACOS=ON -DAURORA_ENABLE_AUDIO=ON -DAURORA_ENABLE_STORAGE_SQLITE=ON -DAURORA_ENABLE_IMAGE_JPEG=ON -DAURORA_ENABLE_IMAGE_WEBP=ON -DAURORA_ENABLE_IMAGE_PNG=ON -DAURORA_ENABLE_WEBVIEW=ON -DAURORA_BUILD_INSPECTOR_SERVER=ON -DAURORA_BUILD_VERIFY_TOOLS=ON

      - name: Select macOS platform TUs
        shell: bash
        run: |
          set -euo pipefail
          git -c core.quotepath=off grep -lE 'AURORA_BACKEND_MACOS|AURORA_PLATFORM_MACOS|AURORA_PLATFORM_APPLE|__APPLE__|TargetConditionals|Cocoa|AppKit|CoreFoundation|CFString' -- src tools tests examples include | sort > mac-tus.txt
          echo "platform token files: $(wc -l < mac-tus.txt)"
          python3 tools/check/select_lint_tus.py --build-dir build-lint --changed mac-tus.txt --changed-only --out-dir build-lint/sel --shards 1
          cat build-lint/sel/selection.json

      - name: Lint macOS platform TUs
        shell: bash
        run: |
          set -euo pipefail
          list=build-lint/sel/tus_0.txt
          if [ ! -s "$list" ]; then
            echo "::error::macOS lint selection is empty - the platform token list matched no translation unit"
            exit 1
          fi
          python3 tools/check/run_clang_tidy.py --build-dir build-lint --tu-list "$list" --json-out build-lint/findings.json --jobs "$(sysctl -n hw.ncpu)"

      - name: Upload tidy findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tidy-findings-macos
          path: build-lint/findings.json
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # 9. 排版门禁：clang-format 全量校验（first-party 源码，任一一处与根 .clang-format
  # 不一致即失败）。
  # 该门禁此前**完全缺失**——仓库里没有任何 clang-format 调用点，配置写的是 Left 而代码库
  # 实际按右对齐书写（约 8.4 : 1），背离累积到 488/823 文件也没被发现。加这道门禁就是为了让
  # 排版漂移在**引入的那一刻**暴露，而不是攒到需要一次性大改。
  # 版本钉死 clang-format-22，与本地 proved 组合一致；依赖 AuroraFormat.cmake 提供的
  # `format-check` 目标（需 configure 时 clang-format 在 PATH 上）。
  # ---------------------------------------------------------------------------
  fmt:
    name: clang-format
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    needs: gate
    if: ${{ !cancelled() && needs.gate.outputs.dup != 'true' }}
    steps:
      - uses: actions/checkout@v7

      # 门禁作业需要的正是「读得懂本仓配置的 clang-format」；命令收进复合动作，与其它作业同源。
      - name: Setup clang-format (repo-parseable)
        uses: ./.github/actions/setup-clang-format

      - name: Configure (clang-format target only)
        run: cmake -S . -B build-fmt -G Ninja -DCMAKE_BUILD_TYPE=Release -DAURORA_ENABLE_CLANG_TIDY=OFF -DAURORA_ENABLE_CLANG_FORMAT=ON

      - name: Check formatting (fails on any divergence)
        run: cmake --build build-fmt --target format-check --parallel
